<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrolled Agent — Complete Package</title>
<meta name="description" content="Enrolled Agent (EA) Exam Prep. All three parts: mock exams, chapter questions, cheat sheets and study notes.">
<meta property="og:title" content="Enrolled Agent — Complete Package">
<meta property="og:description" content="Enrolled Agent EA Exam Prep — all 3 parts. Sign in to study.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="top"><span id="counter"></span><span style="font-size:10px;color:var(--muted);margin-left:8px;opacity:.6">v55</span><span style="display:flex;gap:8px;align-items:center"><button class="acctbtn" id="acctBtn" style="display:none">Sign in</button><span class="acctstate" id="acctState"></span><span class="swwrap"><button class="swbtn" id="swBtn"></button><button class="swbtn swmore" id="swMore" title="Study time by part">▾</button><div class="swpanel" id="swPanel"></div></span><button id="darkToggle" title="Toggle dark mode">🌙</button><span class="score-chip" id="score"></span></span></div>
  <div class="bar"><div id="prog" style="width:0%"></div></div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <div class="main"><div class="card" id="card"></div></div>
  </div>
</div>
<button id="gridToggle" title="Show questions">☰</button>
<button class="totop" id="toTop" title="Back to top">↑</button>
<button class="floatback" id="floatBack">← Back</button>
<script src="data.js"></script>
<script src="questions.js"></script>
<script src="migration-map.js"></script>
<script src="quiz-state.js"></script>
<script src="account-sync.js"></script>
<script src="auth-account-ui.js"></script>
<script src="menu.js"></script>
<script src="review.js"></script>
<script src="flashcards.js"></script>
<script src="quiz-view.js"></script>
<script src="study-tools.js"></script>
<script src="notes.js"></script>
<script src="app-boot.js"></script>
<!-- AI Tutor Widget -->
<link rel="stylesheet" href="ai-tutor.css">


<!-- ==== AI TUTOR: markup ==== -->
<div id="ai-tutor-btn" title="Ask EA Tutor">✦</div>

<div id="ai-tutor-panel">
  <div id="ai-tutor-resize" title="Drag to resize"></div>
  <div id="ai-tutor-header">
    <span>EA Tutor</span>
    <span id="ai-tutor-header-right">
      <button type="button" id="ai-tutor-list-btn" title="My Study List">📚<span id="ai-tutor-list-count" class="ai-list-count" style="display:none">0</span></button>
      <span id="ai-tutor-close">×</span>
    </span>
  </div>
  <div id="ai-tutor-messages">
    <div class="ai-msg bot">Hi. Ask me about the current question or any EA exam topic. Tell me to "add this to my list" any time to save the current topic for later review.</div>
  </div>
  <div id="ai-tutor-list-view" style="display:none">
    <button type="button" id="ai-tutor-list-back">← Back to chat</button>
    <div id="ai-tutor-list-items"></div>
  </div>
  <div id="ai-tutor-quicks">
    <button type="button" data-qp="explain">Explain this question</button>
    <button type="button" data-qp="concept">Explain the concept</button>
    <button type="button" data-qp="wrong">Why is my answer wrong?</button>
    <button type="button" data-qp="mnemonic">Give me a mnemonic</button>
    <button type="button" data-qp="similar">Similar practice Q</button>
    <button type="button" data-qp="summary">Summarize this chapter</button>
  </div>
  <div id="ai-tutor-input-wrap">
    <textarea id="ai-tutor-input" rows="1" placeholder="Ask anything..."></textarea>
    <button id="ai-tutor-send" title="Send">→</button>
  </div>
</div>

<script src="ai-tutor.js"></script>
</body>
</html>
