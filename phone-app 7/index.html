function startShuffledWrongFlagged(){
  var flagged=collectFlagged();
  var wrong=collectWrong();
  // Deduplicate by ref so questions that are BOTH wrong AND flagged aren't repeated
  var seen={};
  var combined=[];
  flagged.concat(wrong).forEach(function(item){
    if(!seen[item.ref]){ seen[item.ref]=true; combined.push(item); }
  });
  if(!combined.length){ alert('Nothing to shuffle — no flagged or wrong questions in this Part yet.'); return; }
  // Fisher-Yates shuffle
  for(var i=combined.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=combined[i]; combined[i]=combined[j]; combined[j]=tmp;
  }
  exam=-9;
  QUESTIONS=combined.map(function(d){return d.q;});
  REVIEW_REFS=combined.map(function(d){return d.ref;});
  st=makeState(QUESTIONS.length,QUESTIONS,true,'practice'); // shuffle answer options too
  st.review=true; pos=0;
  enterQuiz();
}

// ---- "Toughest for me": a curated quiz of the hardest questions FOR THIS STUDENT ----
// Uses every signal we have:
//   - Wrong (currently answered incorrectly): +8
//   - Wrong + flagged double-signal: +4 extra
//   - Flagged: +5
//   - In a weak chapter (accuracy < 70%, ≥3 attempts): +3
//   - In a weak topic (accuracy < 70%, ≥3 attempts): +2
//   - Question text starts with a NOT/EXCEPT trap: +3
//   - Question involves calculations ($, numbers, %): +2
//   - Long question stem (>250 chars, more mental load): +1
//   - Flashcard confidence rating 1 or 2 (student marked "low"): +6
//   - Unanswered but in a weak chapter (fresh challenge): +4
// Then the top N locally-ranked candidates are optionally reranked by the AI
// (cached per Part for 6h so it doesn't fire on every click).
function _textToughFeatures(text){
  var t = String(text || '').toLowerCase();
  var s = 0;
  // Negation/exception traps — EA exam favourite
  if (/\b(not|except|least\s+likely|does\s+not|cannot|is\s+not\s+true|is\s+not\s+correct)\b/i.test(text || '')) s += 3;
  // Contains dollar amounts / percentages / calculations
  if (/\$[\d,]+|\d+%|\bcalculate|\bcompute|\btotal\s+of|\bhow\s+much/i.test(text || '')) s += 2;
  // Long stem
  if (t.length > 250) s += 1;
  return s;
}
// Analyze attempt history to detect misconception patterns:
// for each topic, which wrong option index does the student pick most often?
// If they always pick B when the answer is C on §1031 questions → they have a specific misconception.
function _computeMisconceptions(){
  var attempts = loadAttempts();
  // Need to know each question's topic + correct answer + student's wrong choice — but attempts
  // are keyed by question text hash, we don't know the topic from the hash alone.
  // Do a scan across the loaded PARTS to build a hash→(topic, a) map from the question bank.
  var idx = {};
  try {
    var parts = (typeof PARTS!=='undefined')?PARTS:null;
    if(parts){
      [1,2,3].forEach(function(p){
        if(!parts[p])return;
        (parts[p].exams||[]).forEach(function(ex){ (ex.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
        (parts[p].mcqs||[]).forEach(function(mc){ (mc.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
        (parts[p].extra||[]).forEach(function(g){ (g.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
      });
    }
  } catch(e){}
  // Aggregate wrong-choice picks by topic
  var byTopic = {}; // { topic: { wrongPicks: [c1,c2,c3,c4], total, hotPick } }
  Object.keys(attempts).forEach(function(h){
    var meta = idx[h]; if(!meta) return;
    var tp = meta.topic||''; if(!tp) return;
    attempts[h].forEach(function(att){
      if(att.ok) return; // ignore correct attempts
      if(!byTopic[tp]) byTopic[tp] = { wrong:[0,0,0,0], total:0 };
      if(att.c>=0 && att.c<=3) byTopic[tp].wrong[att.c]++;
      byTopic[tp].total++;
    });
  });
  // Find topics with a dominant wrong-choice bias (>= 40% of wrong attempts fell to one option)
  var out = {};
  Object.keys(byTopic).forEach(function(tp){
    var b = byTopic[tp];
    if(b.total < 3) return;
    var maxIdx = 0, maxN = b.wrong[0];
    for(var i=1;i<4;i++) if(b.wrong[i]>maxN){maxN=b.wrong[i];maxIdx=i;}
    if(maxN/b.total >= 0.4) out[tp] = { bias:maxIdx, count:b.total };
  });
  return out;
}

function collectToughestForMe(limit){
  limit = limit || 25;
  var flagged = collectFlagged();
  var wrong   = collectWrong();
  var fcRatings = {}; try { fcRatings = JSON.parse(localStorage.getItem('ea3quiz_v2_fcRatings')||'{}'); } catch(e){}
  var attempts = loadAttempts();
  var misconceptions = _computeMisconceptions();
  var now = Date.now();
  var DAY = 86400000;

  // Compute per-chapter and per-topic accuracy
  var chapAgg = {}, topicAgg = {};
  function fold(qs, answers){
    if(!answers) return;
    answers.forEach(function(v,j){
      if(v===null||v===undefined||!qs[j]) return;
      var u=qs[j].unit||'—', tp=qs[j].topic||'—';
      chapAgg[u]=chapAgg[u]||{a:0,r:0};   chapAgg[u].a++;   if(v===qs[j].a) chapAgg[u].r++;
      topicAgg[tp]=topicAgg[tp]||{a:0,r:0}; topicAgg[tp].a++; if(v===qs[j].a) topicAgg[tp].r++;
    });
  }
  EXAMS.forEach(function(ex,i){ var s=loadState(i); if(s) fold(ex.questions, s.answers); });
  MCQS.forEach(function(mc,i){ var s=mcqState(i); if(s) fold(mc.questions, s.answers); });
  (XTRA||[]).forEach(function(g,i){ var s=xState(i); if(s) fold(g.questions, s.answers); });
  var weakChapters = {}, weakTopics = {};
  Object.keys(chapAgg).forEach(function(u){ var g=chapAgg[u]; if(g.a>=3 && (g.r/g.a)<0.7) weakChapters[u]=true; });
  Object.keys(topicAgg).forEach(function(t){ var g=topicAgg[t]; if(g.a>=3 && (g.r/g.a)<0.7) weakTopics[t]=true; });

  // Score wrong/flagged candidates
  var byText = {};
  function tag(item, kind){
    var text = String(item.q.q || '');
    if(!byText[text]) byText[text] = { q:item.q, ref:item.ref, score:0, why:{} };
    var s = byText[text];
    if(kind === 'wrong')   { s.score += 8; s.why.wrong = true; }
    if(kind === 'flagged') { s.score += 5; s.why.flagged = true; }
  }
  wrong.forEach(function(i){ tag(i,'wrong'); });
  flagged.forEach(function(i){ tag(i,'flagged'); });

  // Apply all the other signals to whatever we already have
  Object.keys(byText).forEach(function(t){
    var e = byText[t]; var q = e.q;
    if(e.why.wrong && e.why.flagged) { e.score += 4; e.why.doubleSignal = true; }
    if(weakChapters[q.unit||'']) { e.score += 3; e.why.weakChap = true; }
    if(weakTopics[q.topic||'']) { e.score += 2; e.why.weakTopic = true; }
    e.score += _textToughFeatures(q.q);
    // Flashcard confidence: rating 1 or 2 = "still confused"
    var rating = null;
    if(fcRatings && e.ref && fcRatings[e.ref] && typeof fcRatings[e.ref].rating === 'number') rating = fcRatings[e.ref].rating;
    if(rating !== null && rating <= 2) { e.score += 6; e.why.lowConf = true; }
    // Attempt history signals (only present if the student has attempted this question)
    var hist = attempts[_qh(q.q)];
    if(hist && hist.length){
      var wrongs = hist.filter(function(a){return !a.ok;}).length;
      var last = hist[hist.length-1];
      // Multiple wrong attempts across time = truly stuck
      if(wrongs >= 2){ e.score += 10; e.why.repeatWrong = true; }
      // Regression: got it right earlier, wrong now — confidence lost
      if(hist.length >= 2 && hist[hist.length-2].ok && !last.ok){ e.score += 8; e.why.regression = true; }
      // Recency: wrong within the last 3 days
      if(!last.ok && (now - (last.ts||0)) < 3*DAY){ e.score += 3; e.why.recentWrong = true; }
    }
    // Misconception pattern: student has a dominant wrong pick on this topic
    if(q.topic && misconceptions[q.topic]){
      e.score += 2;
      e.why.misconception = misconceptions[q.topic].bias; // stores the biased index
    }
  });

  // Fresh candidates: unanswered questions in weak chapters (real gaps)
  var freshCandidates = [];
  function seed(qs, refPrefix, sourceIdx, stateReader){
    var s = stateReader ? stateReader(sourceIdx) : null;
    qs.forEach(function(q, i){
      var u = q.unit || '';
      if(!weakChapters[u] && !weakTopics[q.topic||'']) return;
      if(s && s.answers && s.answers[i] !== null && s.answers[i] !== undefined) return;
      var text = String(q.q || '');
      if(byText[text]) return;
      var sc = 4 + _textToughFeatures(q.q);
      freshCandidates.push({
        q:q, ref: refPrefix + '_' + sourceIdx + '_' + i,
        score: sc, why:{fresh:true, weakChap:!!weakChapters[u], weakTopic:!!weakTopics[q.topic||'']}
      });
    });
  }
  EXAMS.forEach(function(ex,i){ seed(ex.questions, 'm', i, loadState); });
  MCQS.forEach(function(mc,i){ seed(mc.questions, 'mcq', i, mcqState); });
  (XTRA||[]).forEach(function(g,i){ seed(g.questions, 'xtra', i, xState); });
  for(var f=freshCandidates.length-1; f>0; f--){
    var fj=Math.floor(Math.random()*(f+1));
    var ft=freshCandidates[f]; freshCandidates[f]=freshCandidates[fj]; freshCandidates[fj]=ft;
  }
  freshCandidates.sort(function(a,b){ return b.score - a.score; });

  var scored = Object.keys(byText).map(function(t){ return byText[t]; });
  scored.sort(function(a,b){ return b.score - a.score; });

  // 70% wrong/flagged, 30% fresh weak-area — grow pool for AI reranking
  var poolSize = Math.max(limit, Math.min(50, scored.length + freshCandidates.length));
  var takeScored = Math.min(scored.length, Math.ceil(poolSize * 0.7));
  var raw = scored.slice(0, takeScored);
  var need = poolSize - raw.length;
  if(need > 0) raw = raw.concat(freshCandidates.slice(0, need));

  // ---- Diversify by chapter ----
  // Cap per-chapter to at most Math.ceil(limit / 5) so a single dominant weak chapter
  // doesn't swallow the whole quiz. Overflow goes into a "reserve" bucket that gets
  // dipped into only if we can't fill the pool from other chapters.
  var perChapCap = Math.max(3, Math.ceil(limit / 5));
  var chapCount = {}, primary = [], reserve = [];
  raw.forEach(function(c){
    var u = c.q.unit || '—';
    chapCount[u] = chapCount[u] || 0;
    if(chapCount[u] < perChapCap){ chapCount[u]++; primary.push(c); }
    else reserve.push(c);
  });
  var out = primary.concat(reserve);
  return out;
}

// AI rerank: takes ~40 candidates, sends the student's profile + candidate list to the tutor,
// asks for the top 25 ranked hardest-first for THIS specific student. Result is cached per Part
// so repeatedly opening "Toughest for me" doesn't re-fire the call.
var TOUGH_AI_CACHE_KEY = 'ea3quiz_v2_tough_ai_cache';
function _toughAiCacheGet(){
  try { return JSON.parse(localStorage.getItem(TOUGH_AI_CACHE_KEY)) || {}; } catch(e){ return {}; }
}
function _toughAiCacheSet(all){ try{ localStorage.setItem(TOUGH_AI_CACHE_KEY, JSON.stringify(all)); } catch(e){} }
function _stableQHash(text){
  var s = String(text || '');
  var h = 5381;
  for(var i=0;i<s.length;i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
async function aiRerankToughest(candidates, limit){
  limit = limit || 25;
  if(!candidates || candidates.length <= limit) return candidates; // nothing to rerank
  // Only run for the admin (same gate as the tutor) — costs tokens
  if(typeof isAdminUser !== 'function' || !isAdminUser()) return candidates;
  var authObj = (typeof auth === 'function') ? auth() : null;
  if(!authObj || !authObj.access_token) return candidates; // no auth = no AI

  // Cache check — 6-hour freshness per Part, and refresh if the candidate set has drifted
  var cacheKey = 'p' + (typeof PART!=='undefined'?PART:'?');
  var all = _toughAiCacheGet();
  var currentSig = candidates.map(function(c){ return _stableQHash(c.q.q); }).sort().join(',');
  var currentHash = _stableQHash(currentSig);
  var rec = all[cacheKey];
  var freshMs = 6 * 60 * 60 * 1000;
  if(rec && rec.t && (Date.now() - rec.t) < freshMs && rec.sig === currentHash && Array.isArray(rec.order)){
    // Reorder from cached ranking
    var byHash = {};
    candidates.forEach(function(c){ byHash[_stableQHash(c.q.q)] = c; });
    var ranked = rec.order.map(function(h){ return byHash[h]; }).filter(Boolean);
    // Any candidates the cache didn't rank get appended at the end
    var seen = {}; ranked.forEach(function(c){ seen[_stableQHash(c.q.q)] = true; });
    candidates.forEach(function(c){ if(!seen[_stableQHash(c.q.q)]) ranked.push(c); });
    return ranked.slice(0, limit);
  }

  // Build a compact rerank prompt
  var stats = (typeof _computeLearningStats === 'function') ? null : null;
  var perfLine = '';
  try {
    // Piggyback on the tutor's stat computation if available in scope, else recompute inline
    var chap = {}, topic = {}, tot = 0, ok = 0;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!/^ea3quiz_v2_(?:p[12]_)?(?:mock|mcq|extra)_/.test(k)) continue;
      var s=null; try{s=JSON.parse(localStorage.getItem(k));}catch(e){continue;}
      if(!s||!Array.isArray(s.answers)) continue;
      // Skip: we already have chapAgg-like info baked into candidate.why.*
    }
    perfLine = 'The student has flagged and gotten questions wrong across multiple chapters. Their weak areas are indicated by "weak" flags on candidates.';
  } catch(e){}

  var listStr = candidates.map(function(c, idx){
    var h = _stableQHash(c.q.q);
    var whyBits = [];
    if(c.why.repeatWrong)  whyBits.push('REPEAT-WRONG-2plus');
    if(c.why.regression)   whyBits.push('REGRESSION-right-then-wrong');
    if(c.why.recentWrong)  whyBits.push('RECENT-WRONG-3d');
    if(c.why.wrong)        whyBits.push('WRONG');
    if(c.why.flagged)      whyBits.push('FLAGGED');
    if(c.why.doubleSignal) whyBits.push('WRONG+FLAGGED');
    if(c.why.lowConf)      whyBits.push('low-confidence-fc');
    if(c.why.weakChap)     whyBits.push('weak-chapter');
    if(c.why.weakTopic)    whyBits.push('weak-topic');
    if(typeof c.why.misconception==='number') whyBits.push('bias-picks-' + 'ABCD'.charAt(c.why.misconception));
    if(c.why.fresh)        whyBits.push('unanswered');
    return '[' + h + '] score=' + Math.round(c.score) + ' signals=' + whyBits.join('|') +
           ' ch="' + (c.q.unit||'') + '" topic="' + (c.q.topic||'') + '" q="' + String(c.q.q||'').slice(0, 160).replace(/\n/g,' ') + '"';
  }).join('\n');

  // Also gather a compact misconception summary so the AI can plan a coherent progression
  var mc = _computeMisconceptions();
  var mcLines = Object.keys(mc).slice(0, 6).map(function(tp){
    return '- ' + tp + ': student keeps picking option ' + 'ABCD'.charAt(mc[tp].bias) + ' when wrong (' + mc[tp].count + ' data points)';
  }).join('\n');
  var mcBlock = mcLines ? 'KNOWN MISCONCEPTIONS (dominant wrong-choice pattern by topic):\n' + mcLines + '\n\n' : '';

  var prompt =
    'You are building a personalized "toughest questions for me" quiz for an EA-exam student. ' +
    'RANK the candidates below hardest-first FOR THIS SPECIFIC STUDENT, then return the top ' + limit + '.\n\n' +
    'Signal legend (higher-priority first):\n' +
    ' - REPEAT-WRONG-2plus: they have gotten this exact question wrong 2+ times → they are truly stuck\n' +
    ' - REGRESSION-right-then-wrong: they had it right on a prior attempt but got it wrong most recently → confidence lost\n' +
    ' - WRONG+FLAGGED: currently wrong AND marked for review → high-priority\n' +
    ' - RECENT-WRONG-3d: got it wrong within the last 3 days → still fresh in confusion\n' +
    ' - WRONG: current answer is wrong\n' +
    ' - FLAGGED: student marked for review\n' +
    ' - low-confidence-fc: they rated their flashcard confidence 1 or 2 out of 5\n' +
    ' - weak-chapter / weak-topic: their overall accuracy in this area is below 70%\n' +
    ' - bias-picks-X: on this topic the student consistently picks X when wrong (specific misconception)\n' +
    ' - unanswered: fresh question in a weak area\n\n' +
    mcBlock +
    'CANDIDATES (one per line, [hash] = stable id):\n' + listStr + '\n\n' +
    'Sequencing rules:\n' +
    ' 1. Prioritize REPEAT-WRONG > REGRESSION > WRONG+FLAGGED > RECENT-WRONG > WRONG > FLAGGED+lowConf > weak-area\n' +
    ' 2. Diversify across chapters/topics — no more than 2 in a row from the same chapter\n' +
    ' 3. If the student has a known misconception on a topic, include at least 2 questions covering that topic\n' +
    ' 4. Interleave: don\'t front-load all repeat-wrong questions (student will burn out); alternate difficulty\n\n' +
    'Return ONLY a JSON object of the form: {"ids":["<hash1>","<hash2>", ...]} — exactly ' + limit +
    ' hashes if available, ordered per the rules above. No prose, no code fences, just the JSON.';

  var response = '';
  try {
    // Same CORS reason as the tutor's send(): skip Authorization until the worker's
    // Access-Control-Allow-Headers is updated to include it.
    var res = await fetch('https://ea-ai.tr78601234.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });
    if(!res.ok || !res.body) return candidates;
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      response += decoder.decode(chunk.value, { stream: true });
    }
  } catch(e){ return candidates; }

  // Extract JSON — Gemini sometimes wraps in code fences
  var jsonMatch = response.match(/\{[\s\S]*\}/);
  if(!jsonMatch) return candidates;
  var parsed = null;
  try { parsed = JSON.parse(jsonMatch[0]); } catch(e){ return candidates; }
  var ids = parsed && Array.isArray(parsed.ids) ? parsed.ids : null;
  if(!ids || !ids.length) return candidates;

  // Persist ranking
  all[cacheKey] = { t: Date.now(), sig: currentHash, order: ids };
  _toughAiCacheSet(all);

  var byHash = {};
  candidates.forEach(function(c){ byHash[_stableQHash(c.q.q)] = c; });
  var ranked = ids.map(function(h){ return byHash[h]; }).filter(Boolean);
  var seen = {}; ranked.forEach(function(c){ seen[_stableQHash(c.q.q)] = true; });
  candidates.forEach(function(c){ if(!seen[_stableQHash(c.q.q)]) ranked.push(c); });
  return ranked.slice(0, limit);
}

function fcMasteryPct(){
  var wrong=collectWrong();
  if(!wrong.length) return 0;
  var r=loadFcRatings();
  var total=0;
  wrong.forEach(function(w){
    var entry=r[w.ref];
    total += entry ? entry.r : 0;
  });
  return Math.round((total / (wrong.length * 5)) * 100);
}
function pickWeightedDeck(pool, ratings, size){
  var weighted=pool.map(function(item){
    var entry=ratings[item.ref];
    var confidence=entry ? entry.r : 0;
    var weight = confidence===0 ? 5 : (7 - confidence);
    return {item:item, weight:weight};
  });
  var picked=[];
  var pickCount=Math.min(size, weighted.length);
  for(var i=0;i<pickCount;i++){
    var totalW=weighted.reduce(function(t,x){return t+x.weight;},0);
    var roll=Math.random()*totalW;
    var idx=0;
    for(var j=0;j<weighted.length;j++){
      roll -= weighted[j].weight;
      if(roll<=0){ idx=j; break; }
    }
    picked.push(weighted[idx].item);
    weighted.splice(idx,1);
  }
  return picked;
}

// Find the most relevant chapter-notes section for a given wrong question.
// Returns { front, back, source } or null if no match.
function findBookConcept(item){
  var q = item.q;
  if(!CHNOTES[PART] || !q.unit) return null;

  // Extract search terms: topic + significant words from the question and correct answer
  var stop = {the:1,a:1,an:1,is:1,are:1,was:1,were:1,of:1,to:1,in:1,on:1,at:1,for:1,with:1,by:1,and:1,or:1,but:1,not:1,which:1,following:1,what:1,when:1,where:1,who:1,how:1,does:1,do:1,did:1,has:1,have:1,had:1,be:1,been:1,being:1,this:1,that:1,these:1,those:1,it:1,as:1,if:1,then:1,than:1,from:1,into:1,about:1,taxpayer:1,taxpayers:1,any:1,all:1,each:1,every:1,some:1,except:1,following:1,statement:1,statements:1,true:1,false:1};

  function tokens(str){
    return String(str||'').toLowerCase()
      .replace(/[^a-z0-9§\s]/g,' ')
      .split(/\s+/)
      .filter(function(w){ return w.length>2 && !stop[w]; });
  }

  var qTokens = tokens(q.q + ' ' + (q.topic||'') + ' ' + q.opts[q.a]);
  if(!qTokens.length) return null;
  var tokenSet = {};
  qTokens.forEach(function(t){ tokenSet[t]=(tokenSet[t]||0)+1; });

  // Score every section in the current part's chapter notes
  var best = null;
  var C = CHNOTES[PART];
  Object.keys(C).forEach(function(unitNum){
    var u = C[unitNum];
    if(!u || !u.s) return;
    // Boost score if this section is in the same unit as the question
    var unitBoost = (String(unitNum) === String(q.unit) || (u.t && q.unit && u.t.toLowerCase().indexOf(String(q.unit).toLowerCase())>=0)) ? 3 : 0;
    u.s.forEach(function(sec, si){
      if(!sec.b || !sec.b.length) return;
      var body = sec.t + ' ' + sec.b.join(' ');
      var bodyLower = body.toLowerCase();
      var score = unitBoost;
      Object.keys(tokenSet).forEach(function(t){
        // count occurrences (approximate)
        var re = new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
        var matches = bodyLower.match(re);
        if(matches) score += matches.length;
      });
      if(!best || score > best.score){
        best = { score:score, unit:unitNum, unitTitle:u.t, sec:sec, si:si };
      }
    });
  });

  if(!best || best.score < 3) return null; // require a minimum relevance

  // Format the answer using the actual book section
  var body = best.sec.b.slice(0, 6).join('\n\n'); // up to 6 paragraphs to keep it focused
  var back = body;
  if(best.sec.b.length > 6){
    back += '\n\n(Additional detail in SU ' + best.unit + ' — see full Chapter Notes)';
  }

  // Front: Use the topic if available, otherwise a concept-based prompt
  var front = q.topic
    ? 'Explain: ' + q.topic
    : (q.q.length < 120 ? q.q : q.q.slice(0,120)+'…');

  return {
    front: front,
    back: back,
    source: 'SU ' + best.unit + (best.sec.t ? ' — ' + best.sec.t : '')
  };
}

// Ask the AI Worker as a fallback ONLY when no book match found.
// We include the verified question + correct answer + why so it can't invent facts.
async function generateConceptCard(item){
  // First try to find it in the book
  var bookConcept = findBookConcept(item);
  if(bookConcept) return bookConcept;

  // Fallback: use the verified quiz data as-is (no AI hallucination)
  var q = item.q;
  var correctLetter = String.fromCharCode(65+q.a);
  var back = 'Correct answer (' + correctLetter + '): ' + q.opts[q.a];
  if(q.why) back += '\n\n' + q.why;
  return {
    front: q.topic ? 'Recall: ' + q.topic : q.q,
    back: back,
    source: 'From your question bank'
  };
}

async function ensureConceptForCurrent(){
  var item=FC_DECK[FC_POS];
  if(!item) return;
  var concepts=loadFcConcepts();
  if(concepts[item.ref]){
    FC_CURRENT_CONCEPT = concepts[item.ref];
    return;
  }
  // Book lookup is synchronous — no loading state needed
  var generated = await generateConceptCard(item);
  if(!FC_DECK[FC_POS] || FC_DECK[FC_POS].ref !== item.ref) return;
  if(generated){
    var c=loadFcConcepts();
    c[item.ref]=generated;
    saveFcConcepts(c);
    FC_CURRENT_CONCEPT = generated;
  }
  renderFlashcard();
}

function rateCurrentCard(rating){
  var current=FC_DECK[FC_POS];
  if(!current) return;
  setFcRating(current.ref, rating);
  FC_HISTORY.push({pos:FC_POS, concept:FC_CURRENT_CONCEPT});
  FC_POS++;
  FC_REVEALED=false;
  FC_CURRENT_CONCEPT=null;
  ensureConceptForCurrent();
  renderFlashcard();
}
function fcPrevCard(){
  if(FC_HISTORY.length===0) return;
  var last=FC_HISTORY.pop();
  FC_POS=last.pos;
  FC_CURRENT_CONCEPT=last.concept;
  FC_REVEALED=false;
  renderFlashcard();
}
function fcRegenerateCurrent(){
  var item=FC_DECK[FC_POS]; if(!item) return;
  var concepts=loadFcConcepts();
  delete concepts[item.ref];
  saveFcConcepts(concepts);
  FC_CURRENT_CONCEPT=null;
  FC_REVEALED=false;
  ensureConceptForCurrent();
  renderFlashcard();
}

// ---- keyboard shortcuts (only active during flashcard view) ----
var _fcKeyHandler=null;
function bindFcKeys(){
  if(_fcKeyHandler) return;
  _fcKeyHandler=function(e){
    // Ignore if typing in an input
    var tag=(e.target && e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    // Only active on flashcard view
    if(document.body.getAttribute('data-view')!=='flashcards') return;
    if(e.key===' '||e.key==='Spacebar'){
      e.preventDefault();
      if(!FC_CURRENT_CONCEPT) return;
      if(!FC_REVEALED){ FC_REVEALED=true; renderFlashcard(); }
      else { rateCurrentCard(3); } // Space after reveal = neutral "kinda" and advance
    } else if(/^[1-5]$/.test(e.key) && FC_REVEALED){
      e.preventDefault();
      rateCurrentCard(+e.key);
    } else if(e.key==='Escape'){
      e.preventDefault();
      if(confirm('Exit flashcards? Your ratings are saved.')){ unbindFcKeys(); showMenu(); }
    } else if(e.key==='ArrowLeft'){
      e.preventDefault();
      fcPrevCard();
    } else if(e.key==='r'||e.key==='R'){
      e.preventDefault();
      fcRegenerateCurrent();
    }
  };
  document.addEventListener('keydown', _fcKeyHandler);
}
function unbindFcKeys(){
  if(_fcKeyHandler){ document.removeEventListener('keydown', _fcKeyHandler); _fcKeyHandler=null; }
}

// Format an explanation string so the correct-answer reasoning and the
// 'Why the others are wrong:' bullets render as separate paragraphs and lines.
function fmtExpl(s){
  if(!s) return '';
  var parts=s.split(/\s*Why the others are wrong:\s*/i);
  var main=(parts[0]||'').trim();
  // paragraph-break the main reasoning on double newlines OR sentence-boundary heuristic
  var mainHtml=main.split(/\n{2,}/).map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');
  var out=mainHtml;
  if(parts.length>1 && parts[1].trim()){
    out+='<div class="wow-hd"><b>Why the others are wrong:</b></div>';
    // Split on bullet markers (accept • or -) preceding option letters A-D)
    var body=parts[1];
    var bullets=body.split(/(?=[•\-]\s*[A-D]\)\s*)/).map(function(b){return b.trim();}).filter(Boolean);
    bullets.forEach(function(b){
      var m=b.match(/^[•\-]\s*([A-D])\)\s*([\s\S]*)$/);
      if(m){
        out+='<div class="wow-item"><b>'+m[1]+')</b> '+esc(m[2].trim())+'</div>';
      }else{
        out+='<div class="wow-item">'+esc(b)+'</div>';
      }
    });
  }
  return out;
}

// ---------- quick refresher (book-sourced) ----------
function unitNumOf(u){var m=/^SU\s*(\d+)/.exec(u||'');return m?+m[1]:null;}
function refreshFor(Q){
  var R=REFRESH[PART]; if(!R)return null;
  var un=unitNumOf(Q.unit);
  var keys=R.tmap[Q.topic+'||'+un]||R.tmap[Q.topic+'||null']||null;
  if(!keys||!keys.length){
    if(un&&R.units[un])return {unit:un,secs:[],ub:R.units[un]};
    return null;
  }
  return {unit:un,secs:keys.map(function(k){return R.secs[k];}).filter(Boolean),ub:(un&&R.units[un])?R.units[un]:null};
}
function qrefKey(){
  if(exam>=0)return 'mock:'+exam+':'+st.order[pos];
  if(exam===-4)return 'mcq:'+MCH+':'+st.order[pos];
  return null;               // chapter/review sessions resolve via source ref below
}
function qrefFor(Q){
  var R=QREF[PART]; if(!R)return null;
  var k=qrefKey();
  // chapter-from-mocks and Smart Review carry a source ref like m0_12 -> mock:0:12
  if(!k&&exam<0&&REVIEW_REFS&&REVIEW_REFS[st.order[pos]]){
    var m=/^m(\d+)_(\d+)$/.exec(REVIEW_REFS[st.order[pos]]);
    if(m)k='mock:'+m[1]+':'+m[2];
  }
  if(!k)return null;
  var ids=R.q[k]; if(!ids||!ids.length)return null;
  return ids.map(function(pr){var p=R.p[pr[0]];return p?{u:p.u,sec:p.s,t:p.t,score:pr[1]}:null;}).filter(Boolean);
}
function refresherHTML(Q){
  var hits=qrefFor(Q);
  if(!hits||!hits.length)return '';
  var strong=hits[0].score>=0.20;
  var body=hits.map(function(h){
    return '<div class="rsec"><b>SU '+h.u+' · '+h.sec+'</b><p>'+h.t+'</p></div>';
  }).join('');
  var lbl=hits[0].sec;
  return '<div class="refbox"><button class="refhead" id="refToggle">📌 '+(strong?'What the book says':'Related background')+
    ' <span class="reflbl">'+lbl.slice(0,60)+'</span><span class="chev" id="refChev">▸</span></button>'+
    '<div class="refbody" id="refBody" style="display:none">'+body+
    '<p class="refsrc">Passages from your '+PARTS[PART].name+' study guide, matched to this question.'+
    ((CHNOTES[PART]&&hits[0].u&&CHNOTES[PART][hits[0].u])?' <a href="#" id="refFull">Open full chapter notes →</a>':'')+
    '</p></div></div>';
}
function wireRefresher(){
  var b=document.getElementById('refToggle'); if(!b)return;
  b.onclick=function(){
    var body=document.getElementById('refBody'),ch=document.getElementById('refChev');
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    ch.textContent=open?'▸':'▾';
    var rf=document.getElementById('refFull');
    if(rf&&!rf._w){rf._w=1;rf.onclick=function(ev){
      ev.preventDefault();
      var hits=qrefFor(QUESTIONS[st.order[pos]]);
      if(hits&&hits[0])showNotes(hits[0].u,function(){enterQuiz();});
    };}
  };
}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function markSelection(){
  const qIdx=st.order[pos],perm=getPerm(qIdx);

function pick(dispJ){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const orig=perm[dispJ];
  if(st.mode==='exam'&&!st.examDone){
    st.answers[qIdx]=orig;recordAnswerToday();recordAttempt(Q,orig);saveState();markSelection();renderSide();headerScore();
    const c=counts();document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
    return;
  }
  if(st.answers[qIdx]!==null)return;

}

// ---- Per-question attempt history (used by Toughest for Me) ----
// Stored as { qHash: [{ts, c: chosenIdx, ok: 0|1}, …] } — keeps up to the last 5 attempts.
// Different from st.answers which only remembers the LAST answer.
var ATTEMPTS_KEY='ea3quiz_v2_attempts';
function _qh(text){var s=String(text||''),h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36);}
function loadAttempts(){try{return JSON.parse(localStorage.getItem(ATTEMPTS_KEY))||{};}catch(e){return {};}}
function saveAttempts(a){try{localStorage.setItem(ATTEMPTS_KEY,JSON.stringify(a));}catch(e){}}
function recordAttempt(Q,chose){
  try{
    if(!Q||typeof chose!=='number')return;
    var a=loadAttempts();
    var k=_qh(Q.q);
    if(!a[k])a[k]=[];
    a[k].push({ts:Date.now(),c:chose,ok:(chose===Q.a)?1:0});
    if(a[k].length>5)a[k]=a[k].slice(-5);
    // Global cap: retain the 500 most-recently-touched questions to bound localStorage
    var keys=Object.keys(a);
    if(keys.length>500){
      keys.sort(function(k1,k2){
        var t1=a[k1][a[k1].length-1].ts||0,t2=a[k2][a[k2].length-1].ts||0;
        return t2-t1;
      });
      var kept={};keys.slice(0,500).forEach(function(k){kept[k]=a[k];});
      a=kept;
    }
    saveAttempts(a);
  }catch(e){}
}
function showFeedback(){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const sel=st.answers[qIdx],isRight=sel===Q.a,letters=['A','B','C','D'];
  const correctDisp=perm.indexOf(Q.a),selDisp=perm.indexOf(sel);
  card.querySelectorAll('#opts .opt').forEach(function(b,j){
    b.disabled=true;
    if(j===correctDisp)b.classList.add('correct');
    else if(j===selDisp)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  document.getElementById('verdict').innerHTML='<div class="verdict '+(isRight?'ok':'no')+'">'+(isRight?'✓ Correct!':'✗ Incorrect — the correct answer is '+letters[correctDisp]+'.')+'</div>';
  let html;
  if(Q.expl!==undefined){
    html='<h4>Explanation (correct answer: '+letters[correctDisp]+')</h4><div class="why">'+fmtExpl(Q.expl)+'</div>';
  }else{
    html='<h4>Why '+letters[correctDisp]+' is correct</h4><div class="why">'+Q.why+'</div><h4>Why the other choices are wrong</h4>';
    perm.forEach(function(orig,j){const w=Q.wrongs[orig];if(w)html+='<div class="wrongitem"><b>'+letters[j]+'.</b> '+w+'</div>';});
  }
  const exp=document.getElementById('exp');

// Show the correct answer and explanation for a question the user has not answered.
function showRevealed(){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const letters=['A','B','C','D'],correctDisp=perm.indexOf(Q.a);

    html='<h4>Explanation (correct answer: '+letters[correctDisp]+')</h4><div class="why">'+fmtExpl(Q.expl)+'</div>';
  }else{
    html='<h4>Why '+letters[correctDisp]+' is correct</h4><div class="why">'+Q.why+'</div><h4>Why the other choices are wrong</h4>';
    perm.forEach(function(orig,j){const w=Q.wrongs[orig];if(w)html+='<div class="wrongitem"><b>'+letters[j]+'.</b> '+w+'</div>';});
  }

function submitExam(auto){

function showEnd(){
  stopTimer();side.classList.remove('open');
  const c=counts();
  document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
  document.getElementById('counter').textContent=examName()+' — Results';
  const denom=st.mode==='exam'&&st.examDone?QUESTIONS.length:(c.ans||1);
  const pct=Math.round(c.right/denom*100);
  const units={};
  QUESTIONS.forEach(function(q,i){
    units[q.unit]=units[q.unit]||{total:0,right:0,ans:0};
    units[q.unit].total++;
    if(st.answers[i]!==null){units[q.unit].ans++;if(st.answers[i]===q.a)units[q.unit].right++;}
  });
  const unitRows=Object.entries(units).map(function(en){var u=en[0],s=en[1];return '<tr><td>'+u+'</td><td>'+s.right+'/'+s.ans+' (of '+s.total+')</td><td>'+(s.ans?Math.round(s.right/s.ans*100):0)+'%</td></tr>';}).join('');
  const missed=[];
  st.order.forEach(function(qIdx,p){if(st.answers[qIdx]!==null&&st.answers[qIdx]!==QUESTIONS[qIdx].a)missed.push({p:p,q:QUESTIONS[qIdx]});});
  const flagged=[];
  st.order.forEach(function(qIdx,p){if(st.flags[qIdx])flagged.push({p:p,q:QUESTIONS[qIdx]});});

  const missedList=missed.length?'<h4 style="margin-top:18px">Questions you missed ('+missed.length+')</h4><ul class="missed">'+missed.map(function(m){return '<li><a href="#" data-g="'+m.p+'"><b>Q'+(m.p+1)+'</b></a> — '+m.q.topic+'</li>';}).join('')+'</ul>':(c.ans===QUESTIONS.length?'<p style="margin-top:14px">Perfect — nothing missed! 🎉</p>':'');
  const flagList=flagged.length?'<h4 style="margin-top:14px">Flagged for review (⚑ '+flagged.length+')</h4><ul class="missed">'+flagged.map(function(m){return '<li><a href="#" data-g="'+m.p+'"><b>Q'+(m.p+1)+'</b></a> — '+m.q.topic+'</li>';}).join('')+'</ul>':'';
  card.innerHTML='<div class="end"><h2>'+examName()+' — Results'+(c.ans<QUESTIONS.length&&!(st.mode==='exam'&&st.examDone)?' (in progress)':'')+'</h2>'+
    '<div class="big" style="color:'+(pct>=75?'var(--green)':'var(--red)')+'">'+pct+'%</div>'+
    '<p>You answered <b>'+c.right+' of '+c.ans+'</b> correctly'+(QUESTIONS.length-c.ans>0?' ('+(QUESTIONS.length-c.ans)+' unanswered)':'')+'. The average student score is 75%.</p>'+extra+
    '<table><tr><th>Study Unit</th><th>Correct</th><th>%</th></tr>'+unitRows+'</table>'+missedList+flagList+
    '<button class="restart" id="back">Back to Questions</button>'+
    '<button class="restart" id="menu" style="background:#64748b;margin-left:8px">Exam Menu</button></div>';
  card.querySelectorAll('[data-g]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();pos=+a.dataset.g;renderSide();render();};});
  document.getElementById('back').onclick=function(){startTimerIfNeeded();renderSide();render();};
  document.getElementById('menu').onclick=showMenu;
}

// Find the book section a cheat-sheet row came from, so we can show the full passage.
function sheetSection(r){
  var C=CHNOTES[PART]||{}, u=C[r.u];
  if(!u)return null;
  for(var i=0;i<u.s.length;i++) if(u.s[i].t===r.sec) return {s:u.s[i],si:i,unit:r.u,ut:u.t};
  return null;
}
// Escape, then highlight the exact sentence this row was pulled from.
function markHit(text,needle){
  var t=esc(text);
  if(!needle)return t;
  var n=esc(needle.trim());
  if(n.length>12){
    var at=t.indexOf(n);
    if(at>=0) return t.slice(0,at)+'<mark>'+n+'</mark>'+t.slice(at+n.length);
    // the row may hold only the first clause of a longer paragraph
    var head=n.slice(0,Math.min(60,n.length)), at2=t.indexOf(head);
    if(at2>=0) return t.slice(0,at2)+'<mark>'+t.slice(at2,at2+n.length)+'</mark>'+t.slice(at2+n.length);
  }
  return t;
}
// Full detail panel for one cheat-sheet row: the book's own passage for that rule.
function sheetDetailHTML(r){
  var f=sheetSection(r);
  if(!f)return '<div class="dtwrap"><p class="dtnone">No further detail in the book for this item.</p></div>';
  var h='<div class="dtwrap"><div class="dtsec">'+esc(f.s.t)+'</div>'+
        '<div class="dtfrom">From SU '+f.unit+(f.ut?': '+esc(f.ut):'')+' of your '+PARTS[PART].name+' study guide</div>';
  var exBuf=[];
  function flushEx(){
    if(!exBuf.length)return;
    h+='<details class="nex"><summary>Example — tap to work through it</summary>'+
       exBuf.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</details>';
    exBuf=[];
  }
  f.s.i.forEach(function(pair){
    var k=pair[0],t=pair[1];
    if(k==='ex'){exBuf.push(t);return;}
    flushEx();
    if(k==='table')h+=tableHTML(t);
    else if(k==='li')h+='<ul><li>'+markHit(t,r.t)+'</li></ul>';
    else if(k==='note')h+='<p class="nnote">'+markHit(t,r.t)+'</p>';
    else h+='<p>'+markHit(t,r.t)+'</p>';
  });
  flushEx();
  h+='<button class="dtjump" data-gonotes="'+f.unit+'" data-gosec="'+f.si+'">📘 Open this chapter in full notes →</button>';
  return h+'</div>';
}
// A short headline for the Value cell so the numbers read in context, e.g.
// "Required CE — 72 hours" instead of a bare "72 hours".
function chipLabel(sec){
  var t=(sec||'').replace(/\s*\([^)]*\)\s*/g,' ').replace(/—.*$/,'').replace(/\s+/g,' ').trim();
  if(t.length>34)t=t.slice(0,32).replace(/\s+\S*$/,'')+'…';
  return t;
}
function sheetBody(rows){
  var C=CHNOTES[PART]||{};
  var byU={};
  rows.forEach(function(r){(byU[r.u]=byU[r.u]||[]).push(r);});
  SHEETROWS=rows;
  var h='';
  Object.keys(byU).sort(function(a,b){return a-b;}).forEach(function(u){
    var ut=(C[u]&&C[u].t)?C[u].t:'';
    var open=SHOPEN[u]?true:false;
    h+='<button class="shhead'+(open?' open':'')+'" data-su="'+u+'"><span class="chev">'+(open?'▾':'▸')+'</span>'+
       '<span class="shttl">SU '+u+(ut?': '+esc(ut):'')+'</span>'+
       '<span class="shcount">'+byU[u].length+'</span></button>';
    h+='<div class="shbody" data-subody="'+u+'" style="display:'+(open?'block':'none')+'">';
    h+='<table class="ntable sheet"><tr><th style="width:140px">Value</th><th>Rule</th><th style="width:86px">Detail</th></tr>';
    byU[u].forEach(function(r){
      var i=rows.indexOf(r);
      var lab=chipLabel(r.sec);
      var chips=(lab?'<div class="vlabel">'+esc(lab)+'</div>':'')+
        (r.v.length?r.v.map(function(v){return '<span class="vchip">'+esc(v)+'</span>';}).join(' '):'<span class="vchip dim">see rule</span>');
      if(r.tb){
        h+='<tr class="tbrow"><td colspan="3"><div class="tbwrap"><div class="tblbl">📋 '+esc(r.sec)+'</div>'+tableHTML(r.t)+
           '<button class="dtbtn" data-dt="'+i+'">＋ Explain</button></div></td></tr>';
        h+='<tr class="dtrow" id="dtrow'+i+'" style="display:none"><td colspan="3"></td></tr>';
        return;
      }
      h+='<tr><td>'+chips+'</td><td>'+esc(r.t)+'</td>'+
         '<td><button class="dtbtn" data-dt="'+i+'">＋ Explain</button></td></tr>';
      h+='<tr class="dtrow" id="dtrow'+i+'" style="display:none"><td colspan="3"></td></tr>';
    });
    h+='</table></div>';
  });
  return h;
}
function wireSheetSections(){
  card.querySelectorAll('[data-su]').forEach(function(b){
    b.onclick=function(){
      var u=b.dataset.su;
      shToggle(u);

// Wire the ＋ Explain buttons inside a rendered cheat sheet.
function wireSheetDetail(){
  card.querySelectorAll('[data-dt]').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.dt, tr=document.getElementById('dtrow'+i);
      if(!tr)return;

// ---------- end-of-chapter study questions (from the book) ----------
function bqKey(){return 'ea3quiz_bookq_p'+PART;}
function bqState(){try{return JSON.parse(localStorage.getItem(bqKey()))||{};}catch(e){return {};}}
function bqSave(s){try{localStorage.setItem(bqKey(),JSON.stringify(s));}catch(e){}}
function bookqHTML(n){
  var B=BOOKQ[PART]; if(!B||!B[n]||!B[n].length)return '';
  var qs=B[n], st=bqState(), done=0, right=0;
  qs.forEach(function(q,i){
    var v=st[n+':'+i];
    if(v!==undefined&&v!==null){done++; if(v===q.a)right++;}
  });
  var h='<h3 class="nh" id="bookq">📝 Study Questions <span style="font-weight:400;color:var(--muted);font-size:13px">('+qs.length+' from this chapter'+(done?' · '+right+'/'+done+' correct':'')+')</span></h3>';
  h+='<p style="color:var(--muted);font-size:13px;margin:0 0 12px">Pick an answer and the book’s explanation appears underneath. <a href="#" id="bqReset">Reset answers</a></p>';
  var L=['A','B','C','D'];
  qs.forEach(function(q,i){
    var sel=st[n+':'+i]; var answered=(sel!==undefined&&sel!==null);
    h+='<div class="bq" id="bq'+i+'"><div class="bqq"><span class="bqn">'+(i+1)+'.</span> '+esc(q.q)+'</div>';
    h+='<div class="bqopts">';
    q.opts.forEach(function(o,j){
      var cls='bqopt';
      if(answered){
        if(j===q.a)cls+=' correct';
        else if(j===sel)cls+=' wrong';
        else cls+=' dim';
      }
      h+='<button class="'+cls+'" data-bq="'+i+'" data-opt="'+j+'"'+(answered?' disabled':'')+'><b>'+L[j]+'.</b> '+esc(o)+'</button>';
    });
    h+='</div>';
    h+='<div class="bqans" id="bqans'+i+'"'+(answered?'':' style="display:none"')+'>';
    if(answered){
      h+='<div class="bqverdict '+(sel===q.a?'ok':'no')+'">'+(sel===q.a?'✓ Correct':'✗ Incorrect — the answer is '+L[q.a])+'</div>'+
         '<div class="why">'+fmtExpl(q.expl)+'</div>';
    }
    h+='</div></div>';
  });
  return h;
}
function wireBookq(n){
  var B=BOOKQ[PART]; if(!B||!B[n])return;
  var qs=B[n], L=['A','B','C','D'];
  card.querySelectorAll('[data-bq]').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.bq, j=+b.dataset.opt, q=qs[i];
      var s=bqState(); s[n+':'+i]=j; bqSave(s);
      var wrap=document.getElementById('bq'+i);
      wrap.querySelectorAll('.bqopt').forEach(function(o,k){
        o.disabled=true;
        o.classList.remove('correct','wrong','dim');
        if(k===q.a)o.classList.add('correct');
        else if(k===j)o.classList.add('wrong');
        else o.classList.add('dim');
      });
      var ans=document.getElementById('bqans'+i);
      ans.innerHTML='<div class="bqverdict '+(j===q.a?'ok':'no')+'">'+(j===q.a?'✓ Correct':'✗ Incorrect — the answer is '+L[q.a])+'</div><p>'+esc(q.expl)+'</p>';
      ans.style.display='block';
      var hdr=document.querySelector('#bookq span');
      if(hdr){
        var st2=bqState(),d=0,r=0;
        qs.forEach(function(qq,ii){var v=st2[n+':'+ii];if(v!==undefined&&v!==null){d++;if(v===qq.a)r++;}});
        hdr.textContent='('+qs.length+' from this chapter'+(d?' · '+r+'/'+d+' correct':'')+')';
      }
    };
  });
  var rs=document.getElementById('bqReset');
  if(rs)rs.onclick=function(e){
    e.preventDefault();
    var s=bqState();
    Object.keys(s).forEach(function(k){if(k.indexOf(n+':')===0)delete s[k];});
    bqSave(s); showNotes(n,NOTEBACK);
  };
}

function timeReport(){

  var units=Object.keys(t.units).map(function(k){return {u:k,s:t.units[k]};}).sort(function(a,b){return b.s-a.s;}).slice(0,12);

function showDashboard(){
  markView('dash');
  setFloatBack(goBack,'← Back');
  side.classList.remove('active','open');document.body.classList.remove('inquiz');stopTimer();stopClock();
  document.getElementById('counter').textContent='My Performance';
  document.getElementById('score').textContent='';
  document.getElementById('prog').style.width='0%';
  const units={},topics={};let tA=0,tR=0;
  const fold=function(qs,ans){
    qs.forEach(function(q,i){
      const v=ans[i];if(v===null||v===undefined)return;
      const r=v===q.a;tA++;if(r)tR++;
      units[q.unit]=units[q.unit]||{a:0,r:0};units[q.unit].a++;if(r)units[q.unit].r++;
      topics[q.topic]=topics[q.topic]||{a:0,r:0};topics[q.topic].a++;if(r)topics[q.topic].r++;
    });
  };
  EXAMS.forEach(function(ex,e){const s=loadState(e);if(s)fold(ex.questions,s.answers);});
  MCQS.forEach(function(mc,mi){const s=mcqState(mi);if(s)fold(mc.questions,s.answers);});
  XTRA.forEach(function(g,i){const s=xState(i);if(s)fold(g.questions,s.answers);});
  if(!tA){
    card.innerHTML='<div class="end"><h2>📊 My Performance</h2><p style="margin:14px 0">No answers recorded yet — answer some questions in any mock or chapter, then check back here to see your strongest and weakest areas.</p>'+timeReport()+'<button class="restart" id="menu">Exam Menu</button></div>';
    document.getElementById('menu').onclick=showMenu;return;
  }
  const rows=function(obj,minA){return Object.entries(obj).map(function(en){const p=Math.round(en[1].r/en[1].a*100);return{u:en[0],a:en[1].a,r:en[1].r,p:p};}).filter(function(x){return x.a>=minA;}).sort(function(x,y){return x.p-y.p;});};
  const uRows=rows(units,1);
  const tRows=rows(topics,2).slice(0,15);
  const bar=function(p){const col=p>=75?'var(--green)':(p>=50?'#f59e0b':'var(--red)');return '<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;min-width:80px"><div style="height:100%;width:'+p+'%;background:'+col+'"></div></div>';};
  const mk=function(list){return list.map(function(x){return '<tr><td>'+x.u+'</td><td style="white-space:nowrap">'+x.r+'/'+x.a+' ('+x.p+'%)</td><td>'+bar(x.p)+'</td></tr>';}).join('');};
  const pct=Math.round(tR/tA*100);
  card.innerHTML='<div class="end"><h2>📊 My Performance</h2>'+
    '<div class="big" style="color:'+(pct>=75?'var(--green)':'var(--red)')+'">'+pct+'%</div>'+
    '<p><b>'+tR+' of '+tA+'</b> questions answered correctly across all mocks, chapter questions, and Becker questions. The exam pass line is roughly 75% — anything below that in a section needs restudy. Weakest areas are listed first.</p>'+
    '<h4 style="margin-top:16px">By Study Unit</h4><table><tr><th>Study Unit</th><th>Score</th><th style="min-width:90px">Bar</th></tr>'+mk(uRows)+'</table>'+
    (tRows.length?'<h4 style="margin-top:16px">Weakest Topics <span style="font-weight:400;color:var(--muted)">(2+ questions answered)</span></h4><table><tr><th>Topic</th><th>Score</th><th style="min-width:90px">Bar</th></tr>'+mk(tRows)+'</table>':'')+
    '<p style="color:var(--muted);font-size:13px;margin-top:12px">Tip: use 🔁 Smart Review on the menu to drill the exact questions behind these numbers.</p>'+
    timeReport()+
    '<button class="restart" id="menu">Exam Menu</button></div>';
  document.getElementById('menu').onclick=showMenu;
}

// ==== SCROLL / VIEW STATE RESTORATION
// ============================================================================
// ---------- remember where you were (survives refresh) ----------

// Remember the reading position for each screen, so leaving and coming back puts you
// back where you were rather than at the top.
var SCRKEY='ea3quiz_scroll', CURSIG=null, SCRTIMER=null;
function scrollMap(){ try{return JSON.parse(localStorage.getItem(SCRKEY))||{};}catch(e){return {};} }
function sigOf(v){
  if(!v)return null;
  return [v.part,v.kind,v.unit||'',v.filt||'',v.mch||'',v.chap||'',v.xch||''].join('|');
}
function rememberScroll(){
  if(!CURSIG)return;
  var y=window.pageYOffset||document.documentElement.scrollTop||0;
  var m=scrollMap();
  if(y>40)m[CURSIG]=y; else delete m[CURSIG];
  try{localStorage.setItem(SCRKEY,JSON.stringify(m));}catch(e){}
}
function restoreScroll(){
  var y=CURSIG?(scrollMap()[CURSIG]||0):0;
  var go=function(){ try{window.scrollTo(0,y);}catch(e){} };
  go();
  // the page is still laying out on first paint, so try again next frame
  if(window.requestAnimationFrame)requestAnimationFrame(function(){requestAnimationFrame(go);});
  setTimeout(go,60);
}
window.addEventListener('scroll',function(){
  clearTimeout(SCRTIMER);
  SCRTIMER=setTimeout(rememberScroll,250);
},{passive:true});
window.addEventListener('beforeunload',rememberScroll);
var VKEY='ea_view_local';
// one-time: move legacy synced view marker into a device-local key so each device
// keeps its own current view (question, chapter, etc.) independent of the other.
(function(){
  try{
    var legacy=localStorage.getItem('ea3quiz_view');
    if(legacy && !localStorage.getItem(VKEY)) localStorage.setItem(VKEY,legacy);
    if(legacy) localStorage.removeItem('ea3quiz_view');
  }catch(e){}
})();
function saveView(v){try{localStorage.setItem(VKEY,JSON.stringify(v));}catch(e){}}
// Navigation history: each markView pushes the previous view descriptor so
// the floating Back button walks through actual history instead of jumping home.
var NAV_STACK=[], NAV_POPPING=false, PREV_VIEW=null;
function navPush(v){ if(NAV_POPPING) return; if(v) NAV_STACK.push(v); if(NAV_STACK.length>60) NAV_STACK.shift(); }
function navGo(v){
  if(!v||!v.kind){ showParts(); return; }
  NAV_POPPING=true;
  try{
    var K=v.kind;
    if(v.part && v.part!==PART) selectPart(v.part);
    if(K==='parts') showParts();
    else if(K==='menu') showMenu();
    else if(K==='mcqlist' && typeof mcqChapterList==='function') mcqChapterList();
    else if(K==='xlist' && typeof extraList==='function') extraList();
    else if(K==='noteslist' && typeof notesUnitList==='function') notesUnitList();
    else if(K==='dash' && typeof showDashboard==='function') showDashboard();
    else if(K==='notes' && typeof showNotes==='function' && v.unit!=null) showNotes(v.unit);
    else if((K==='nums'||K==='dl') && typeof showSheet==='function') showSheet(K==='dl'?'dl':'nums', v.filt||'all');
    else if(K==='acct' && typeof acctScreen==='function') acctScreen();
    else if(K==='quiz'){
      // resume the specific quiz using its stored context
      if(v.mch!=null && typeof startMcq==='function') startMcq(v.mch);
      else if(v.xch!=null && typeof startExtra==='function') startExtra(v.xch);
      else if(v.chap!=null && typeof startChapter==='function') startChapter(v.chap);
      else if(v.exam!=null && v.exam>=0 && typeof startFlow==='function') startFlow(v.exam);
      else showMenu();
    }
    else showMenu();
  }catch(e){ showMenu(); }
  finally{ NAV_POPPING=false; }
}
function goBack(){
  var v=NAV_STACK.pop();
  if(v) navGo(v); else showParts();
}
function markView(kind,extra){
  var v={part:PART,kind:kind};
  if(extra)for(var k in extra)v[k]=extra[k];
  var sig=sigOf(v);
  if(CURSIG&&CURSIG!==sig){ rememberScroll(); if(PREV_VIEW) navPush(PREV_VIEW); }
  PREV_VIEW=v;   // bank where we were before moving on
  CURSIG=sig;
  saveView(v);
}
function restoreView(){
  if(authGate()){ acctScreen(); return; }
  var v=null;
  try{v=JSON.parse(localStorage.getItem(VKEY));}catch(e){}
  if(!v||!v.kind||!PARTS[v.part]){showParts();return;}
  try{
    selectPart(v.part);
    if(v.kind==='parts'){showParts();return;}
    if(v.kind==='menu'){showMenu();return;}
    if(v.kind==='notes'&&CHNOTES[PART]&&CHNOTES[PART][v.unit]){showNotes(v.unit,notesUnitList);return;}
    if(v.kind==='noteslist'){notesUnitList();return;}
    if(v.kind==='mcqlist'&&MCQS.length){mcqChapterList();return;}
    if(v.kind==='xlist'&&XTRA.length){extraList();return;}
    if(v.kind==='acct'){acctScreen();return;}
    if(v.kind==='nums'){showSheet('nums',v.filt||'all');return;}
    if(v.kind==='dl'){showSheet('dl');return;}
    if(v.kind==='dash'){showDashboard();return;}
    if(v.kind==='quiz'){
      if(v.exam>=0&&EXAMS[v.exam]&&loadState(v.exam)){startFlow(v.exam);}
      else if(v.exam===-4&&MCQS[v.mch]){startMcq(v.mch);}
      else if(v.exam===-3&&UNITS[v.chap]){startChapter(v.chap);}
      else if(v.exam===-5&&XTRA[v.xch]){startExtra(v.xch);}
      else {showMenu();return;}
      if(typeof v.pos==='number'&&st&&v.pos<st.order.length){pos=v.pos;renderSide();render();}
      return;
    }
  }catch(e){}
  showMenu();
}

// ---------- floating back button (follows you down the page) ----------
var FLOATBACK=null;
// Only float when the page is actually long enough to scroll — on a short page the

// ---------- keyboard shortcuts ----------
document.addEventListener('keydown',function(e){
  if(!st||exam===-1)return;                                  // only inside a quiz
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var nb=document.getElementById('next'), pb=document.getElementById('prev');
  if(e.key==='ArrowRight'){ if(nb){e.preventDefault();nb.click();} return; }
  if(e.key==='ArrowLeft'){ if(pb&&!pb.disabled){e.preventDefault();pb.click();} return; }
  // Up/Down jump a row in the sidebar grid (5 columns) so 93 -> Up = 88, Down = 98
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(typeof pos!=='number'||!Array.isArray(QUESTIONS))return;
    var step=(e.key==='ArrowDown')?5:-5;
    var np=Math.max(0,Math.min(QUESTIONS.length-1,pos+step));
    if(np===pos)return;
    e.preventDefault();
    pos=np;
    try{ if(typeof saveState==='function') saveState(); }catch(err){}
    try{ if(typeof renderSide==='function') renderSide(); }catch(err){}
    try{ if(typeof render==='function') render(); }catch(err){}
    try{ if(typeof scrollTop==='function') scrollTop(); }catch(err){}
    return;
  }
  if(e.key==='f'||e.key==='F'){ var fb=document.getElementById('flagBtn'); if(fb){e.preventDefault();fb.click();} return; }
  // Ask AI: `?` (shift+/) or `i` — both open the tutor with the "explain this question" prompt
  if(e.key==='?'||e.key==='i'||e.key==='I'){
    var aab=document.getElementById('askAiBtn'); if(aab){e.preventDefault();aab.click();}
    return;
  }
  var k=e.key.toUpperCase();
  if(k>='A'&&k<='D'){
    var opts=document.querySelectorAll('#opts .opt');
    var i='ABCD'.indexOf(k);
    if(opts[i]&&!opts[i].disabled){e.preventDefault();opts[i].click();}
  }
});

      '<p style="color:var(--muted);font-size:13px">'+String(e)+'</p></div>';
    return;
  }
  __wire();
  __migrateExtraStateV1();
  initDark(); initStopwatch(); renderAcct();
  var a=auth(); if(a){ setSync('sync'); syncNow('quiet'); }
  restoreView();
  var ab=document.getElementById('acctBtn'); if(ab)ab.onclick=acctScreen;
  // Kick off the demo watcher (banner + auto-expire)
  setInterval(_demoTick, 1000);
  _demoTick();
}

// ---- Demo-mode UI: banner shows remaining time; on expiration, block use and sign out ----
function _demoTick(){
  try{
    var d=demoInfo();
    var bar=document.getElementById('demoBanner');
    var block=document.getElementById('demoBlock');
    var showBanner = d && d.forEmail && auth() && auth().email===d.forEmail && d.active;
    var showBlock  = d && d.forEmail && auth() && auth().email===d.forEmail && d.expired;
    if(showBanner){
      if(!bar){
        bar=document.createElement('div');
        bar.id='demoBanner';
        bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9998;background:rgba(59,130,246,.95);color:#fff;padding:8px 14px;font-size:13.5px;font-weight:600;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15);';
        document.body.appendChild(bar);
        document.body.style.paddingTop='36px';
      }
      var aiLeft = (typeof demoAiRemaining === 'function') ? demoAiRemaining() : 0;
      var aiPart = ' · '+aiLeft+' / '+DEMO_AI_LIMIT+' AI questions left';
      bar.textContent='Demo access — '+fmtDemoTime(d.remaining)+' remaining'+aiPart+'. Ask the admin for full access to keep going.';
    } else if(bar){
      bar.remove(); document.body.style.paddingTop='';
    }
    if(showBlock){
      if(!block){
        block=document.createElement('div');
        block.id='demoBlock';
        block.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;';
        block.innerHTML='<div style="background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">'+
          '<div style="font-size:44px;margin-bottom:12px">⏳</div>'+
          '<h2 style="margin:0 0 10px;font-size:20px">Your 15-minute demo has ended</h2>'+
          '<p style="margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.5">Thanks for trying the app. To continue studying, ask the admin to upgrade you to full access.</p>'+
          '<button id="demoSignout" class="opt" style="margin:0">Sign out</button>'+
          '</div>';
        document.body.appendChild(block);
        document.getElementById('demoSignout').onclick=function(){
          try{ signOut(); }catch(e){}
          endDemo();
          location.reload();
        };
      }
    } else if(block){
      block.remove();
    }
  }catch(e){}
}

__boot();
