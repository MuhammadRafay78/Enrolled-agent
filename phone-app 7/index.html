<script>
var MCQS = null;

var EXAMS = []; // ADD_MOCKS_HERE

const card=document.getElementById('card');
const side=document.getElementById('side');
const EXAM_MS=210*60*1000; // 3.5 hours
let exam=-1, QUESTIONS=[], st=null, pos=0, timerInt=null, REVIEW_REFS=[];

// ---------- helpers ----------

// ============================================================================
// ==== HELPERS: state basics, storage keys, shuffle
// ============================================================================
function pp(){return PART===3?'':('p'+PART+'_');}
const skey=e=>'ea3quiz_v2_'+pp()+'mock_'+e;
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const REFOPT=/all of the above|none of the above|all of these|none of these|both .* and|are correct/i;
function canShuffleOpts(q){return !q.opts.some(function(o){return REFOPT.test(o);});}
function makeState(len,qs,shuffle,mode){
  const order=Array.from(Array(len).keys());
  let optOrder=null;
  if(shuffle){
    shuffleArr(order);
    optOrder=qs.map(function(q){const p=[0,1,2,3];return canShuffleOpts(q)?shuffleArr(p):p;});
  }
  return {answers:Array(len).fill(null),order:order,optOrder:optOrder,flags:Array(len).fill(false),mode:mode,examStart:mode==='exam'?Date.now():null,examDone:false};
}
function loadState(e){
  try{
    const v2=JSON.parse(localStorage.getItem(skey(e)));
    if(v2&&Array.isArray(v2.answers)&&v2.answers.length===EXAMS[e].questions.length)return v2;
  }catch(err){}
  try{
    const v1=JSON.parse(localStorage.getItem('ea3quiz_mock_'+e));
    if(Array.isArray(v1)&&v1.length===EXAMS[e].questions.length){
      const s=makeState(v1.length,EXAMS[e].questions,false,'practice');
      s.answers=v1;
      localStorage.setItem(skey(e),JSON.stringify(s));
      return s;
    }
  }catch(err){}
  return null;
}
function saveState(){
  if(!st)return;
  if(typeof pos==='number')st.pos=pos;      // resume on this question next time
  try{
    if(exam>=0)localStorage.setItem(skey(exam),JSON.stringify(st));
    else if(exam===-3)localStorage.setItem(chapKey(CHAP),JSON.stringify(st));
    else if(exam===-4)localStorage.setItem(mcqKey(MCH),JSON.stringify(st));
    else if(exam===-5)localStorage.setItem(xKey(XCH),JSON.stringify(st));
  }catch(err){}
}
// Where to open a quiz: the question you were last looking at, otherwise the first one
// you have not answered. Browsing with answers shown leaves nothing "answered", so
// without this you would always be sent back to question 1.
function resumePos(state){
  if(!state||!state.order)return 0;
  if(typeof state.pos==='number'&&state.pos>=0&&state.pos<state.order.length)return state.pos;
  var first=state.order.map(function(qi){return state.answers[qi];}).findIndex(function(a){return a===null;});
  return first===-1?0:first;
}
function getPerm(qIdx){return (st.optOrder&&st.optOrder[qIdx])?st.optOrder[qIdx]:[0,1,2,3];}
function refOf(qIdx){return exam>=0?('m'+exam+'_'+qIdx):REVIEW_REFS[qIdx];}
function feedbackOn(){return st.mode==='practice'||st.examDone;}
// "See answers" — reveal the answer without recording an attempt, so scores stay honest.
// Blocked while an exam simulation is still running.
function canReveal(){return !(st.mode==='exam'&&!st.examDone);}
function isRevealed(qIdx){
  if(!canReveal())return false;
  if(st.revealAll)return true;
  return !!(st.revealed&&st.revealed[qIdx]);
}
function setRevealed(qIdx,on){
  if(!st.revealed)st.revealed={};
  if(on)st.revealed[qIdx]=1; else delete st.revealed[qIdx];
  saveState();
}
function toggleRevealAll(){
  st.revealAll=!st.revealAll;
  saveState();renderSide();render();
}
function counts(){
  let ans=0,right=0;
  st.answers.forEach(function(v,i){if(v!==null){ans++;if(v===QUESTIONS[i].a)right++;}});
  return {ans:ans,right:right};
}
// ---------- spaced repetition ----------

// ============================================================================
// ==== STUDY TIME TRACKING
// ============================================================================
// ---------- study time tracking ----------
var TKEY='ea3quiz_time', tickInt=null, lastAct=Date.now();
function getTime(){try{return JSON.parse(localStorage.getItem(TKEY))||{parts:{},sets:{},units:{},topics:{},days:{}};}catch(err){return {parts:{},sets:{},units:{},topics:{},days:{}};}}
function saveTime(t){try{localStorage.setItem(TKEY,JSON.stringify(t));}catch(err){}}
function fmtDur(s){
  s=Math.round(s||0);
  if(s<60)return s+'s';
  var h=Math.floor(s/3600),m=Math.round(s%3600/60);
  return h?(h+'h '+m+'m'):(m+'m');
}
function setLabel(){
  if(exam>=0)return {k:'p'+PART+':mock:'+exam, label:PARTS[PART].name+' — '+EXAMS[exam].name};
  if(exam===-3)return {k:'p'+PART+':unit:'+CHAP, label:PARTS[PART].name+' — '+UNITS[CHAP].name};
  if(exam===-4)return {k:'p'+PART+':mcq:'+MCH, label:PARTS[PART].name+' — '+MCQS[MCH].name};
  if(exam===-2)return {k:'p'+PART+':review', label:PARTS[PART].name+' — Smart Review'};
  return null;
}
function tickTime(){
  if(!st||exam===-1)return;
  if(document.visibilityState==='hidden')return;
  if(Date.now()-lastAct>120000)return;               // idle guard: pause after 2 min inactivity
  var sl=setLabel(); if(!sl)return;
  var t=getTime(), q=QUESTIONS[st.order[pos]];
  t.parts[PART]=(t.parts[PART]||0)+1;
  t.sets[sl.k]=t.sets[sl.k]||{s:0,label:sl.label};
  t.sets[sl.k].s+=1;
  if(q){
    if(q.unit){t.units[q.unit]=(t.units[q.unit]||0)+1;}
    if(q.topic){t.topics[q.topic]=(t.topics[q.topic]||0)+1;}
  }
  var d=new Date().toISOString().slice(0,10);
  t.days[d]=(t.days[d]||0)+1;
  saveTime(t);
}
function startClock(){stopClock();tickInt=setInterval(tickTime,1000);}
function stopClock(){if(tickInt){clearInterval(tickInt);tickInt=null;}}
['keydown','click','mousemove','touchstart','scroll'].forEach(function(ev){
  document.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});
});

// ============================================================================
// ==== MANUAL STOPWATCH
// ============================================================================
// ---------- manual study stopwatch (Start / Stop per part) ----------
// Separate from the automatic tracker above: this one only counts when you tell it to.
// per-device stopwatch: each device stores its own timer state under a device-tagged key.
// Displays sum across all devices via swGetAll(); accrual/writes still target THIS device only.
function ea_dev_id(){
  var d=null; try{d=localStorage.getItem('ea_device_id');}catch(e){}
  if(!d){ d=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    try{localStorage.setItem('ea_device_id',d);}catch(e){} }
  return d;
}
var SWKEY='ea3quiz_stopwatch_'+ea_dev_id(), SWANCHORKEY='ea3quiz_sw_anchor', SWINT=null;
function _swAnchor(){ try{var v=JSON.parse(localStorage.getItem(SWANCHORKEY));if(v&&(v.tot||v.days))return {tot:v.tot||{},days:v.days||{}};}catch(e){} return {tot:{},days:{}}; }
function _swSaveAnchor(a){ try{localStorage.setItem(SWANCHORKEY,JSON.stringify(a));}catch(e){} }

// one-time migration: move legacy single-key stopwatch to this device's key so no time is lost.
(function(){
  try{
    var legacy=localStorage.getItem('ea3quiz_stopwatch');
    if(legacy && !localStorage.getItem(SWKEY)){
      localStorage.setItem(SWKEY,legacy);
      localStorage.removeItem('ea3quiz_stopwatch');
    }
  }catch(e){}
})();
// Aggregate across all ea3quiz_stopwatch_* keys (this device + any others that have synced in).
function swGetAll(){
  var A=_swAnchor();
  var out={tot:{},days:{},run:null};
  Object.keys(A.tot||{}).forEach(function(p){ out.tot[p]=(out.tot[p]||0)+(A.tot[p]||0); });
  Object.keys(A.days||{}).forEach(function(day){
    var v=A.days[day]; var n=(typeof v==='number')?v:0;
    if(v && typeof v==='object'){ Object.keys(v).forEach(function(p){ n+=(v[p]||0); }); }
    out.days[day]=(out.days[day]||0)+n;
  });
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k || k.indexOf('ea3quiz_stopwatch_')!==0) continue;
      var s=null; try{s=JSON.parse(localStorage.getItem(k));}catch(e){}
      if(!s) continue;
      var t=s.tot||{};
      Object.keys(t).forEach(function(p){ out.tot[p]=(out.tot[p]||0)+(t[p]||0); });
      var d=s.days||{};
      Object.keys(d).forEach(function(day){
        var v=d[day];
        // days can be either a number (total seconds that day) or an object (per-part). Sum to a number.
        var n=(typeof v==='number')?v:0;
        if(v && typeof v==='object'){ Object.keys(v).forEach(function(p){ n+=(v[p]||0); }); }
        out.days[day]=(out.days[day]||0)+n;
      });
      if(k===SWKEY && s.run) out.run=s.run;
    }
  }catch(e){}
  return out;
}
// v31: undo the v29 legacy-doubling. Runs once per device.
(function(){
  try{ if(localStorage.getItem('ea_sw_dedup_v31')==='1') return; }catch(e){}
  try{
    var buckets=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k) continue;
      if(k.indexOf('ea3quiz_stopwatch_')!==0) continue;
      var v=null; try{ v=JSON.parse(localStorage.getItem(k)); }catch(e){}
      if(v) buckets.push({k:k,v:v});
    }
    if(buckets.length){
      // MAX per part / per day across buckets — represents the shared legacy total.
      var A=_swAnchor(); var tot={}, days={};
      buckets.forEach(function(b){
        var t=b.v.tot||{};
        Object.keys(t).forEach(function(p){ tot[p]=Math.max(tot[p]||0, t[p]||0); });
        var d=b.v.days||{};
        Object.keys(d).forEach(function(day){
          var val=d[day]; var n=(typeof val==='number')?val:0;
          if(val && typeof val==='object'){ Object.keys(val).forEach(function(p){ n+=(val[p]||0); }); }
          days[day]=Math.max(days[day]||0, n);
        });
      });
      // Keep the existing anchor as a floor (in case another device already migrated).
      Object.keys(A.tot||{}).forEach(function(p){ tot[p]=Math.max(tot[p]||0, A.tot[p]||0); });
      Object.keys(A.days||{}).forEach(function(day){ days[day]=Math.max(days[day]||0, A.days[day]||0); });
      _swSaveAnchor({tot:tot,days:days});
      // Zero out this device's bucket; keep run info if present.
      var mine=null; try{mine=JSON.parse(localStorage.getItem(SWKEY));}catch(e){}
      var newMine={tot:{},days:{},run:(mine&&mine.run)?mine.run:null};
      try{localStorage.setItem(SWKEY,JSON.stringify(newMine));}catch(e){}
      // For any other-device buckets that happen to sit locally, replace with empty so
      // sync propagation reflects a de-duplicated state.
      buckets.forEach(function(b){ if(b.k!==SWKEY){ try{localStorage.setItem(b.k, JSON.stringify({tot:{},days:{},run:null}));}catch(e){} } });
    }
    try{localStorage.setItem('ea_sw_dedup_v31','1');}catch(e){}
  }catch(e){}
})();

function swGet(){
  try{var s=JSON.parse(localStorage.getItem(SWKEY));if(s&&s.tot)return s;}catch(e){}
  return {tot:{},days:{},run:null};
}
function swSave(s){try{localStorage.setItem(SWKEY,JSON.stringify(s));}catch(e){}}
function dayKey(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayKey(){ var d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); }
function hhmmss(sec){
  sec=Math.max(0,Math.round(sec||0));
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;
  return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');
}
// Time is banked second by second into the day it actually happened, so a session
// running past midnight splits across both days by itself.
function swAccrue(s,now){
  if(!s.run)return false;
  var last=s.run.last||s.run.t;
  var delta=Math.floor((now-last)/1000);
  if(delta<=0)return false;
  s.days=s.days||{};
  s.days[dayKey()]=(s.days[dayKey()]||0)+delta;
  // credit the part you are actually on right now, not the one you started on —
  // so switching parts mid-session moves the clock with you
  var pnow=(typeof PART!=='undefined')?PART:s.run.p;
  s.tot[pnow]=(s.tot[pnow]||0)+delta;
  s.run.p=pnow;
  s.run.last=last+delta*1000;
  s.run.seen=now;
  return true;
}
function swDay(s,k){ return (s.days&&s.days[k])||0; }
function swTotal(s){ var t=0,d=s.days||{}; for(var k in d)t+=d[k]; return t; }
function swPartTotal(s,p){ return s.tot[p]||0; }
// A clock left running when the browser closed: everything up to the last tick is
// already banked. Treat that like an auto-pause (not an end) so the session — and
// its question count — survives being reopened later; only an explicit "End
// session" click should reset the count to zero.
function swRecover(){
  var s=swGet();
  if(s.run&&s.run.seen&&Date.now()-s.run.seen>180000){
    var legSec=Math.max(0,(s.run.seen-s.run.t)/1000);
    var legQ=Math.max(0,totalAnsweredAllTime()-(s.run.q0||0));
    if(s.session){s.session.accSec=(s.session.accSec||0)+legSec; s.session.qBank=(s.session.qBank||0)+legQ; s.session.p=s.run.p;}
    s.run=null; swSave(s);
  }
  return s;
}
// Live elapsed seconds for the current session: banked prior legs + the leg in progress.
function swSessionElapsed(s){
  var acc=(s.session&&s.session.accSec)||0;
  return acc+(s.run?Math.max(0,(Date.now()-s.run.t)/1000):0);
}
// Questions answered so far this session: banked prior legs + the leg in progress.
// Banking per-leg (like time) means answers from OTHER activity while paused don't
// silently bleed into a session that isn't actively running.
function swSessionQCount(s){
  if(!s.session)return 0;
  var banked=s.session.qBank||0;
  var live=s.run?Math.max(0,totalAnsweredAllTime()-(s.run.q0||0)):0;
  return banked+live;
}
// Formats an average pace like "48s/question" or "2m 10s/question".
function fmtPace(sec,q){
  if(!q)return '';
  var avg=sec/q;
  return (avg<60?Math.round(avg)+'s':fmtDur(avg))+'/question';
}
// Start: begin a brand-new session (question count resets to 0) and start the clock.
function swStart(){
  var s=swGet();
  if(s.session)return;
  var now=Date.now();
  s.session={accSec:0,qBank:0,startedAt:now,p:PART};
  s.run={p:PART,t:now,last:now,seen:now,q0:totalAnsweredAllTime()};
  swSave(s); swRender(); swPanelRender(); swTick();
}
// Pause: stop the clock but keep the session (and its banked question count) alive.
function swPause(){
  var s=swGet();
  if(!s.run)return;
  var legSec=Math.max(0,(Date.now()-s.run.t)/1000);
  var legQ=Math.max(0,totalAnsweredAllTime()-(s.run.q0||0));
  swAccrue(s,Date.now());
  if(s.session){s.session.accSec=(s.session.accSec||0)+legSec; s.session.qBank=(s.session.qBank||0)+legQ; s.session.p=s.run.p;}
  s.run=null; swSave(s);
  if(SWINT){clearInterval(SWINT);SWINT=null;}
  swRender(); swPanelRender();
}
// Resume: continue the current session's clock and question count from where it paused.
function swResume(){
  var s=swGet();
  if(s.run||!s.session)return;
  var now=Date.now();
  s.run={p:PART,t:now,last:now,seen:now,q0:totalAnsweredAllTime()};
  s.session.p=PART;
  swSave(s); swRender(); swPanelRender(); swTick();
}
// Stop/End session: finalize into "Last session" and reset the question count to 0.
function swStop(){
  var s=swGet();
  if(!s.session&&!s.run)return;
  var legSec=0, legQ=0;
  if(s.run){
    legSec=Math.max(0,(Date.now()-s.run.t)/1000);
    legQ=Math.max(0,totalAnsweredAllTime()-(s.run.q0||0));
    swAccrue(s,Date.now());
  }
  var accSec=((s.session&&s.session.accSec)||0)+legSec;
  var qTotal=((s.session&&s.session.qBank)||0)+legQ;
  s.lastSession={q:qTotal,sec:Math.round(accSec),endedAt:Date.now()};
  s.run=null; s.session=null; swSave(s);
  if(SWINT){clearInterval(SWINT);SWINT=null;}
  swRender(); swPanelRender();
}
// Header chip: no session → start; running → pause; paused → resume.
function swToggle(){
  var s=swGet();
  if(!s.session)swStart();
  else if(s.run)swPause();
  else swResume();
}
function swTick(){
  if(SWINT)clearInterval(SWINT);
  SWINT=setInterval(function(){
    var s=swGet();
    if(!s.run){clearInterval(SWINT);SWINT=null;swRender();return;}
    swAccrue(s,Date.now()); swSave(s);
    swRender();
    var p=document.getElementById('swPanel');
    if(p&&p.classList.contains('open'))swPanelRender();
  },1000);
}
function swRender(){
  var b=document.getElementById('swBtn'); if(!b)return;
  var s=swGetAll(), dev=swGet(), running=!!dev.run, paused=!!dev.session&&!dev.run, today=swDay(s,dayKey());
  var q=dev.session?swSessionQCount(dev):0;
  b.className='swbtn'+(running?' running':(paused?' paused':''));
  b.innerHTML=(running?'<span class="swdot"></span>':(paused?'<span class="swdot paused"></span>':'⏱ '))+
    '<span class="swtime">'+(running||paused?hhmmss(today):(today>0?fmtDur(today):'Start'))+'</span>'+
    (dev.session?'<span class="swqcount">· '+q+' q'+(paused?' · paused':'')+'</span>':'');
  b.title=running?('Timing now — '+q+' question'+(q===1?'':'s')+' this session. Click to pause.')
        :paused?('Paused — '+q+' question'+(q===1?'':'s')+' so far. Click to resume.')
        :'Today’s study time — click to start the timer.';
}
function swPanelRender(){
  var el=document.getElementById('swPanel'); if(!el)return;
  var s=swGetAll(), dev=swGet(), run=!!dev.run, paused=!!dev.session&&!dev.run;
  var today=swDay(s,dayKey()), yday=swDay(s,yesterdayKey()), all=swTotal(s);
  var curPart=run?dev.run.p:(paused?dev.session.p:null);
  var sessH='';
  if(dev.session){
    var qNow=swSessionQCount(dev), secNow=swSessionElapsed(dev);
    sessH='<div class="swcap">This session'+(paused?' (paused)':'')+'</div>'+
      '<div class="swsess">'+qNow+' question'+(qNow===1?'':'s')+' · '+hhmmss(secNow)+
      (qNow?' · '+fmtPace(secNow,qNow):'')+'</div>';
  }else if(dev.lastSession&&(dev.lastSession.q||dev.lastSession.sec)){
    var ls=dev.lastSession;
    sessH='<div class="swcap">Last session</div>'+
      '<div class="swsess">'+ls.q+' question'+(ls.q===1?'':'s')+' in '+hhmmss(ls.sec)+
      (ls.q?' · '+fmtPace(ls.sec,ls.q):'')+'</div>';
  }
  var goLabel=run?'⏸ Pause the time':(paused?'▶ Resume the time':'▶ Start the time');
  var h='<h4>Study timer</h4>'+
    '<div class="swbig">'+hhmmss(today)+'</div>'+
    '<div class="swsub">today'+(curPart!=null?(run?' · running · ':' · paused · ')+(PARTS[curPart]?PARTS[curPart].name:'Part '+curPart):'')+'</div>'+
    '<button class="swgo'+(run?' pause':'')+'" id="swGo">'+goLabel+'</button>'+
    (dev.session?'<button class="swend" id="swEnd">■ End session</button>':'')+
    sessH+
    '<div class="swcap">By day</div>'+
    '<table class="swtbl">'+
      '<tr class="cur"><td>Today</td><td>'+fmtDur(today)+'</td></tr>'+
      '<tr><td>Yesterday</td><td>'+fmtDur(yday)+'</td></tr>'+
      '<tr><td>Total</td><td>'+fmtDur(all)+'</td></tr>'+
    '</table>'+
    '<div class="swcap">By part</div>'+
    '<table class="swtbl">'+[1,2,3].map(function(p){
      var cur=curPart!=null?String(curPart)===String(p):String(PART)===String(p);
      return '<tr'+(cur?' class="cur"':'')+'><td>'+(PARTS[p]?PARTS[p].name:'Part '+p)+'</td><td>'+fmtDur(swPartTotal(s,p))+'</td></tr>';
    }).join('')+'</table>'+
    '<div class="swfoot"><span style="color:var(--muted)">Pausing keeps this session\'s question count · ending resets it</span></div>';
  el.innerHTML=h;
  document.getElementById('swGo').onclick=function(){swToggle();};
  var endBtn=document.getElementById('swEnd');

// ---------- daily activity tracking (EST timezone) ----------
// Tracks how many questions the user answers per day, across all Parts.
// Stored under an ea3quiz_ key so it syncs cross-device via Supabase.
var DAILY_KEY='ea3quiz_v2_daily';
function estDate(d){
  // Returns YYYY-MM-DD in America/New_York timezone
  try{return (d||new Date()).toLocaleDateString('en-CA',{timeZone:'America/New_York'});}
  catch(e){return (d||new Date()).toISOString().slice(0,10);}
}
function dailyLog(){
  try{return JSON.parse(localStorage.getItem(DAILY_KEY))||{};}catch(e){return {};}
}
function recordAnswerToday(){
  var log=dailyLog(); var k=estDate();
  log[k]=(log[k]||0)+1;
  try{localStorage.setItem(DAILY_KEY,JSON.stringify(log));}catch(e){}
}
function todayCount(){ return dailyLog()[estDate()]||0; }
// Lifetime count of answers logged, used to measure how many questions were
// attempted during a given Start/Stop timer session (session count = delta of this).
function totalAnsweredAllTime(){ var log=dailyLog(),t=0; for(var k in log)t+=(log[k]||0); return t; }
function currentStreak(){
  var log=dailyLog(); var streak=0;
  var d=new Date();
  // If today has 0, streak might still be alive counting from yesterday — but
  // for a study-habit tracker, we want to reflect "today included."
  // Convention: streak counts consecutive days with >0 up to and including today.
  // If today is 0, streak = 0 (broken).
  if(!log[estDate(d)])return 0;
  while(true){
    var k=estDate(d);
    if(log[k]&&log[k]>0){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>3650)break; // safety
  }
  return streak;
}
// Total questions answered across the current streak's days (inclusive of today)
function streakTotal(){
  var streak=currentStreak(); if(!streak)return 0;
  var log=dailyLog(); var total=0; var d=new Date();
  for(var i=0;i<streak;i++){
    var k=estDate(d);
    total+=(log[k]||0);
    d.setDate(d.getDate()-1);
  }
  return total;
}

function isSynced(k){
  if(!/^ea3quiz/.test(k)) return false;
  if(k===AUTHK||k===METAK) return false;
  // Device-local: these can grow large or are per-device by nature. Excluding them from
  // sync keeps the payload under Supabase's request-size limit. Question/flag progress
  // (mock, mcq, extra, gleim, chapter) is unaffected and still syncs.
  var DEVICE_LOCAL = {
    'ea3quiz_demo': 1,                    // demo session timer, per-device
    'ea3quiz_v2_ai_chats': 1,             // per-question chat history — can be 100s of KB
    'ea3quiz_v2_ai_resp_cache': 1,        // AI response cache — can be 100s of KB
    'ea3quiz_v2_tough_ai_cache': 1,       // Toughest-for-me ranking cache
    'ea3quiz_v2_tutorSize': 1,            // AI panel width preference
    'ea3quiz_v2_ai_migration_v1': 1,      // one-time boot marker
    'ea_theme_local': 1,                  // theme preference is already local-only by name
    'ea3quiz_sec': 1                      // collapsed-section state
  };
  if(DEVICE_LOCAL[k]) return false;
  return true;
}
function auth(){ try{return JSON.parse(localStorage.getItem(AUTHK))||null;}catch(e){return null;} }

function meta(){ try{return JSON.parse(localStorage.getItem(METAK))||{};}catch(e){return {};} }
function stamp(k){
  if(!isSynced(k))return;
  var m=meta();
  // strictly increasing: two edits in the same millisecond must still order correctly
  m[k]=Math.max(Date.now(),(m[k]||0)+1);
  try{Storage.prototype.setItem.call(localStorage,METAK,JSON.stringify(m));}catch(e){}
}

// Record every local edit and schedule a push. Patch the prototype rather than the
// instance: localStorage is a platform object and per-instance assignment is ignored.
(function(){
  try{
    var P=Storage.prototype, oset=P.setItem, orem=P.removeItem;
    P.setItem=function(k,v){
      oset.call(this,k,v);
      try{ if(this===window.localStorage&&isSynced(k)){ stamp(k); queuePush(); } }catch(e){}
    };
    P.removeItem=function(k){
      orem.call(this,k);
      try{ if(this===window.localStorage&&isSynced(k)){ stamp(k); queuePush(); } }catch(e){}
    };
  }catch(e){}
})();

function localBundle(){

// Merge rule: for each key the newer timestamp wins. Progress is per-exam, so two
// devices working on different exams both keep their work.
async function syncNow(force){

  var _quiet=(force==='quiet');
  if(!navigator.onLine){ if(!_quiet) setSync('offline'); return; }
  if(!_quiet) setSync('sync');

    var r=await apiRetry('/rest/v1/progress?select=k,v,t',{method:'GET'});
    if(!r.ok) throw new Error('read failed ('+r.status+')');
    var rows=await r.json();
    var remote={}; rows.forEach(function(x){remote[x.k]={v:x.v,t:Number(x.t)||0};});
    var local=localBundle(), m=meta(), push=[];
    var keys={};
    Object.keys(local).forEach(function(k){keys[k]=1;});
    Object.keys(remote).forEach(function(k){keys[k]=1;});
    var changed=false;
    Object.keys(keys).forEach(function(k){
      var L=local[k], R=remote[k];
      if(L&&(!R||L.t>R.t)) push.push({k:k,v:L.v,t:L.t});
      else if(R&&(!L||R.t>L.t)){
        try{ localStorage.setItem(k,R.v); }catch(e){}
        m[k]=R.t; changed=true;
      }
    });
    try{localStorage.setItem(METAK,JSON.stringify(m));}catch(e){}

      var pushBody=push.map(function(x){return {k:x.k,v:x.v,t:x.t};});
      var pr=await apiRetry('/rest/v1/progress',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(pushBody)});

      // so ONE bad row doesn't kill the whole sync. Skip rows > 500KB entirely — they
      // won't ever succeed and are usually stale cache values that snuck through.
      if(!pr.ok){

        for(var _i=0;_i<pushBody.length;_i++){
          var _row=pushBody[_i];
          if((_row.v||'').length > 500000){ skipped.push(_row.k); continue; }
          try{
            var _prOne=await apiRetry('/rest/v1/progress',{method:'POST',
              headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},

          }catch(e){}
        }

      // still running the older file, translate them into the new Chapter shape here.
      try{ if(typeof __migrateExtraStateV1==='function') __migrateExtraStateV1(); }catch(e){}
      // Refresh visible surfaces WITHOUT jumping to the other device's view/position.
      // Each device keeps its own current question; sidebar/timer refresh in place.
      try{ if(typeof renderAcct==='function') renderAcct(); }catch(e){}
      try{ if(typeof swRender==='function') swRender(); }catch(e){}
      try{ var _p=document.getElementById('swPanel'); if(_p && _p.classList.contains('open') && typeof swPanelRender==='function') swPanelRender(); }catch(e){}
      try{
        if(typeof exam==='undefined' || exam===-1){
          // Not in a quiz: safe to restore the menu view so home counts refresh.
          if(typeof restoreView==='function') restoreView();
        }else if(Array.isArray(QUESTIONS)){
          // In a quiz: reload answers/flags from the freshly-pulled localStorage
          // but PRESERVE this device's current position.
          var _load=null;
          if(exam===-4 && typeof MCH!=='undefined' && typeof mcqState==='function') _load=function(){return mcqState(MCH);};
          else if(exam===-5 && typeof XCH!=='undefined' && typeof xState==='function') _load=function(){return xState(XCH);};
          else if(exam>=0 && typeof loadState==='function') _load=function(){return loadState(exam);};
          if(_load){

              if(Array.isArray(_fresh.flags)) st.flags=_fresh.flags;

    try{

// Diagnostic: return a summary of everything that WOULD sync + total size,
// plus the last sync error. Call from console: window.diagnoseSync()
window.diagnoseSync = function(){
  try{
    var bundle = localBundle();
    var totalBytes = 0, rows = [];
    Object.keys(bundle).forEach(function(k){
      var v = bundle[k].v || '';
      rows.push({ key: k, bytes: v.length, kb: (v.length/1024).toFixed(1) });
      totalBytes += v.length;
    });
    rows.sort(function(a,b){ return b.bytes - a.bytes; });
    return {
      totalBytes: totalBytes,
      totalKB: (totalBytes/1024).toFixed(1),
      rowCount: rows.length,
      top10: rows.slice(0, 10),
      lastError: window._lastSyncError || null,
      auth: (auth() && { name: auth().name, email: auth().email, tokenLen: (auth().access_token||'').length }) || null,
      online: navigator.onLine,
      supaConfigured: !!(SUPA.url && SUPA.key)
    };
  }catch(e){ return { err: String(e) }; }
};

var THEMES=[
  {id:'light',   label:'Light',      icon:'☀️',  cls:'',         sw:'#f4f6f9'},
  {id:'dim',     label:'Dim',        icon:'🌑',  cls:'dim',      sw:'#1a1e26'},
  {id:'dark',    label:'Dark',       icon:'🌒',  cls:'dark',     sw:'#14181f'},

  {id:'dracula', label:'Dracula',    icon:'🧛',  cls:'dracula',  sw:'#282a36'},
  {id:'solarized',label:'Solarized', icon:'🧭',  cls:'solarized',sw:'#002b36'},
  {id:'tokyo',   label:'Tokyo Night',icon:'🗼',  cls:'tokyo',    sw:'#1a1b26'},
  {id:'forest',  label:'Forest',     icon:'🌲',  cls:'forest',   sw:'#1a2418'},
  {id:'amber',   label:'Amber',      icon:'🕯️',  cls:'amber',    sw:'#1a1408'}
];
var THEME_CLASSES=['dim','dark','slate','midnight','onyx','dracula','solarized','tokyo','forest','amber','sepia','ocean','warm','nord','rose','hc','is-dark'];
function applyTheme(id){
  var t=THEMES.find(function(x){return x.id===id;})||THEMES[0];
  var b=document.body;
  THEME_CLASSES.forEach(function(c){ b.classList.remove(c); });
  if(t.cls) b.classList.add(t.cls);
  // Mark the body as "is-dark" for any non-light theme so shared dark-mode
  // sub-element styling applies across every dark variant.
  if(t.cls) b.classList.add('is-dark');
  // Force a reflow so subsequent paint uses the new theme cleanly.
  void b.offsetHeight;
  var btn=document.getElementById('darkToggle');
  if(btn){ btn.textContent=t.icon; btn.title='Theme: '+t.label+' (click to change)'; }
  try{localStorage.setItem('ea_theme_local',t.id);}catch(err){}
  // legacy write for anything still reading ea3quiz_dark — but do NOT write ea3quiz_theme (would sync across devices)
  try{localStorage.setItem('ea3quiz_dark', (t.cls?'1':'0'));}catch(err){}
}
function initDark(){
  var saved=null;
  try{ saved=localStorage.getItem('ea_theme_local'); }catch(err){}
  if(!saved){
    // migrate legacy synced theme key
    try{ saved=localStorage.getItem('ea3quiz_theme'); if(saved) localStorage.setItem('ea_theme_local',saved); }catch(err){}
  }
  if(!saved){
    try{ if(localStorage.getItem('ea3quiz_dark')==='1') saved='dark'; }catch(err){}
  }
  // Retired themes map to the closest current one
  var retired={ocean:'tokyo',warm:'amber',nord:'tokyo',rose:'dracula',sepia:'light',hc:'dark',slate:'midnight',onyx:'midnight'};
  if(saved && retired[saved]) saved=retired[saved];
  applyTheme(saved||'light');
  // Purge the now-unused synced key so it doesn't clash with the local one.
  try{ localStorage.removeItem('ea3quiz_theme'); }catch(err){}
  var b=document.getElementById('darkToggle'); if(!b)return;
  b.onclick=function(ev){
    ev.stopPropagation();
    var cur=(function(){try{return localStorage.getItem('ea_theme_local');}catch(e){return null;}})()||'light';
    var old=document.getElementById('themePop'); if(old){old.remove(); return;}
    var pop=document.createElement('div');
    pop.id='themePop'; pop.className='themepop';
    pop.innerHTML='<div class="tphd">Theme</div><div class="tpgrid">'+
      THEMES.map(function(t){return '<button class="tpitem'+(t.id===cur?" sel":"")+'" data-tid="'+t.id+'">'+
        '<span class="tpsw" style="background:'+t.sw+'"></span>'+
        '<span class="tpname">'+t.label+'</span></button>';}).join('')+'</div>';
    document.body.appendChild(pop);
    var r=b.getBoundingClientRect();
    pop.style.top=(r.bottom+8+window.scrollY)+'px';
    pop.style.right=Math.max(8, window.innerWidth-r.right)+'px';
    pop.querySelectorAll('[data-tid]').forEach(function(el){
      el.onclick=function(){ applyTheme(el.dataset.tid); pop.remove(); };
    });
    setTimeout(function(){
      var close=function(e){ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('click',close); } };
      document.addEventListener('click',close);
    },0);
  };
}

// ---------- timer ----------
function fmtMs(ms){
  if(ms<0)ms=0;
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}
function tickTimer(){
  if(!st||st.mode!=='exam'||st.examDone){stopTimer();return;}
  const rem=EXAM_MS-(Date.now()-st.examStart);
  const c=counts();
  document.getElementById('score').textContent='⏱ '+fmtMs(rem)+' · '+c.ans+'/'+QUESTIONS.length;
  if(rem<=0){submitExam(true);}
}
function startTimerIfNeeded(){
  stopTimer();
  if(st&&st.mode==='exam'&&!st.examDone){
    if(EXAM_MS-(Date.now()-st.examStart)<=0){submitExam(true);return;}
    timerInt=setInterval(tickTimer,1000);tickTimer();
  }
}

function renderSearch(term){
  const box=document.getElementById('sres');
  term=(term||'').trim().toLowerCase();
  if(term.length<3){box.innerHTML='';return;}
  const match=function(q){return q.q.toLowerCase().includes(term)||(q.topic||'').toLowerCase().includes(term)||(q.unit||'').toLowerCase().includes(term);};
  const hits=[];
  const MAX_HITS=200;
  EXAMS.forEach(function(ex,e){ex.questions.forEach(function(q,i){
    if(hits.length>=MAX_HITS)return;
    if(match(q))hits.push({kind:'mock',e:e,i:i,q:q,label:'Mock '+(e+1)+' · Q'+(i+1)});
  });});
  MCQS.forEach(function(mc,mi){mc.questions.forEach(function(q,i){
    if(hits.length>=MAX_HITS)return;
    if(match(q))hits.push({kind:'mcq',e:mi,i:i,q:q,label:'MCQ Ch'+mc.n+' · Q'+(i+1)});
  });});
  XTRA.forEach(function(g,xi){g.questions.forEach(function(q,i){
    if(hits.length>=MAX_HITS)return;
    if(match(q))hits.push({kind:'xtra',e:xi,i:i,q:q,label:esc(g.name)+' · Q'+(i+1)});
  });});
  if(!hits.length){box.innerHTML='<p style="color:var(--muted);font-size:13px;margin-bottom:14px">No matches.</p>';return;}
  var header='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;">'+
    '<span style="font-size:13px;color:var(--muted)"><b style="color:var(--ink)">'+hits.length+(hits.length>=MAX_HITS?'+':'')+'</b> matching '+(hits.length===1?'question':'questions')+' found</span>'+
    '<button class="mpill" id="attemptSearchBtn" style="background:var(--blue-bg,rgba(37,99,235,.1));color:var(--blue);border-color:var(--blue);font-weight:600">✦ Attempt all '+hits.length+'</button>'+
    '</div>';
  box.innerHTML=header+hits.map(function(h){
    return '<button class="sitem" data-k="'+h.kind+'" data-se="'+h.e+'" data-si="'+h.i+'"><b>'+h.label+'</b> <span class="stopic">'+esc(h.q.topic||'')+'</span><br><span class="ssnip">'+esc(h.q.q.slice(0,110))+'…</span></button>';
  }).join('')+'<div style="height:14px"></div>';
  box.querySelectorAll('.sitem').forEach(function(b){b.onclick=function(){
    if(b.dataset.k==='mcq')jumpMcq(+b.dataset.se,+b.dataset.si);
    else if(b.dataset.k==='xtra'){startExtra(+b.dataset.se); pos=st.order.indexOf(+b.dataset.si); if(pos<0)pos=0; renderSide(); render();}
    else jumpTo(+b.dataset.se,+b.dataset.si);
  };});
  var asb=document.getElementById('attemptSearchBtn');
  if(asb)asb.onclick=function(){startSearchQuiz(hits, term);};
}
function startSearchQuiz(hits, term){
  if(!hits||!hits.length)return;
  exam=-8;
  QUESTIONS=hits.map(function(h){return h.q;});
  REVIEW_REFS=hits.map(function(h){
    if(h.kind==='mock')return 'm'+h.e+'_'+h.i;
    if(h.kind==='mcq')return 'mcq'+h.e+'_'+h.i;
    return 'xtra'+h.e+'_'+h.i;
  });
  window._searchQuizTerm = term || '';
  st=makeState(QUESTIONS.length,QUESTIONS,false,'practice');
  st.review=true; pos=0;
  enterQuiz();
}
function jumpTo(e,qi){
  let s=loadState(e);
  if(!s){s=makeState(EXAMS[e].questions.length,EXAMS[e].questions,false,'practice');}
  exam=e;st=s;QUESTIONS=EXAMS[e].questions;saveState();
  pos=st.order.indexOf(qi);if(pos<0)pos=0;
  enterQuiz();
}
function jumpMcq(ci,qi){
  startMcq(ci);
  pos=st.order.indexOf(qi);if(pos<0)pos=0;
  renderSide();render();
}

function deriveUnits(exams){
  const map={};
  exams.forEach(function(ex,e){ex.questions.forEach(function(q,i){
    if(!map[q.unit])map[q.unit]={name:q.unit,items:[]};
    map[q.unit].items.push({e:e,i:i});
  });});
  return Object.values(map).sort(function(a,b){
    return (parseInt(a.name.replace(/\D+/,''))||99)-(parseInt(b.name.replace(/\D+/,''))||99);
  });
}

// Gather questions across all sources in the current PART matching a predicate.
// Returns array of {q, ref}.
function gatherAcrossPart(matchFn){
  var out=[];
  // Mocks + practice exam
  EXAMS.forEach(function(ex,e){
    var s=loadState(e); if(!s)return;
    ex.questions.forEach(function(q,i){
      if(matchFn(s,i,q)) out.push({q:q, ref:'m'+e+'_'+i});
    });
  });
  // Chapter question sets
  MCQS.forEach(function(mc,mi){
    var s=mcqState(mi); if(!s)return;
    mc.questions.forEach(function(q,i){
      if(matchFn(s,i,q)) out.push({q:q, ref:'mcq'+mi+'_'+i});
    });
  });
  // Extra question sets
  XTRA.forEach(function(g,xi){
    var s=xState(xi); if(!s)return;
    g.questions.forEach(function(q,i){
      if(matchFn(s,i,q)) out.push({q:q, ref:'xtra'+xi+'_'+i});
    });
  });
  return out;
}
function collectFlagged(){
  return gatherAcrossPart(function(s,i){ return s.flags && s.flags[i]===true; });
}
function collectWrong(){
  return gatherAcrossPart(function(s,i,q){
    return s.answers && s.answers[i]!==null && s.answers[i]!==undefined && s.answers[i]!==q.a;
  });
}
function startFlaggedReview(){

}
function startWrongReview(){

  exam=-7;
  QUESTIONS=items.map(function(d){return d.q;});

function startShuffledWrongFlagged(){
  var flagged=collectFlagged();
  var wrong=collectWrong();
  // Deduplicate by ref so questions that are BOTH wrong AND flagged aren't repeated
  var seen={};
  var combined=[];
  flagged.concat(wrong).forEach(function(item){
    if(!seen[item.ref]){ seen[item.ref]=true; combined.push(item); }
  });
  if(!combined.length){ alert('Nothing to shuffle — no flagged or wrong questions in this Part yet.'); return; }
  // Fisher-Yates shuffle
  for(var i=combined.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=combined[i]; combined[i]=combined[j]; combined[j]=tmp;
  }
  exam=-9;
  QUESTIONS=combined.map(function(d){return d.q;});
  REVIEW_REFS=combined.map(function(d){return d.ref;});
  st=makeState(QUESTIONS.length,QUESTIONS,true,'practice'); // shuffle answer options too
  st.review=true; pos=0;
  enterQuiz();
}

// ---- "Toughest for me": a curated quiz of the hardest questions FOR THIS STUDENT ----
// Uses every signal we have:
//   - Wrong (currently answered incorrectly): +8
//   - Wrong + flagged double-signal: +4 extra
//   - Flagged: +5
//   - In a weak chapter (accuracy < 70%, ≥3 attempts): +3
//   - In a weak topic (accuracy < 70%, ≥3 attempts): +2
//   - Question text starts with a NOT/EXCEPT trap: +3
//   - Question involves calculations ($, numbers, %): +2
//   - Long question stem (>250 chars, more mental load): +1
//   - Flashcard confidence rating 1 or 2 (student marked "low"): +6
//   - Unanswered but in a weak chapter (fresh challenge): +4
// Then the top N locally-ranked candidates are optionally reranked by the AI
// (cached per Part for 6h so it doesn't fire on every click).
function _textToughFeatures(text){
  var t = String(text || '').toLowerCase();
  var s = 0;
  // Negation/exception traps — EA exam favourite
  if (/\b(not|except|least\s+likely|does\s+not|cannot|is\s+not\s+true|is\s+not\s+correct)\b/i.test(text || '')) s += 3;
  // Contains dollar amounts / percentages / calculations
  if (/\$[\d,]+|\d+%|\bcalculate|\bcompute|\btotal\s+of|\bhow\s+much/i.test(text || '')) s += 2;
  // Long stem
  if (t.length > 250) s += 1;
  return s;
}
// Analyze attempt history to detect misconception patterns:
// for each topic, which wrong option index does the student pick most often?
// If they always pick B when the answer is C on §1031 questions → they have a specific misconception.
function _computeMisconceptions(){
  var attempts = loadAttempts();
  // Need to know each question's topic + correct answer + student's wrong choice — but attempts
  // are keyed by question text hash, we don't know the topic from the hash alone.
  // Do a scan across the loaded PARTS to build a hash→(topic, a) map from the question bank.
  var idx = {};
  try {
    var parts = (typeof PARTS!=='undefined')?PARTS:null;
    if(parts){
      [1,2,3].forEach(function(p){
        if(!parts[p])return;
        (parts[p].exams||[]).forEach(function(ex){ (ex.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
        (parts[p].mcqs||[]).forEach(function(mc){ (mc.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
        (parts[p].extra||[]).forEach(function(g){ (g.questions||[]).forEach(function(q){ idx[_qh(q.q)]={topic:q.topic,unit:q.unit,a:q.a}; }); });
      });
    }
  } catch(e){}
  // Aggregate wrong-choice picks by topic
  var byTopic = {}; // { topic: { wrongPicks: [c1,c2,c3,c4], total, hotPick } }
  Object.keys(attempts).forEach(function(h){
    var meta = idx[h]; if(!meta) return;
    var tp = meta.topic||''; if(!tp) return;
    attempts[h].forEach(function(att){
      if(att.ok) return; // ignore correct attempts
      if(!byTopic[tp]) byTopic[tp] = { wrong:[0,0,0,0], total:0 };
      if(att.c>=0 && att.c<=3) byTopic[tp].wrong[att.c]++;
      byTopic[tp].total++;
    });
  });
  // Find topics with a dominant wrong-choice bias (>= 40% of wrong attempts fell to one option)
  var out = {};
  Object.keys(byTopic).forEach(function(tp){
    var b = byTopic[tp];
    if(b.total < 3) return;
    var maxIdx = 0, maxN = b.wrong[0];
    for(var i=1;i<4;i++) if(b.wrong[i]>maxN){maxN=b.wrong[i];maxIdx=i;}
    if(maxN/b.total >= 0.4) out[tp] = { bias:maxIdx, count:b.total };
  });
  return out;
}

function collectToughestForMe(limit){
  limit = limit || 25;
  var flagged = collectFlagged();
  var wrong   = collectWrong();
  var fcRatings = {}; try { fcRatings = JSON.parse(localStorage.getItem('ea3quiz_v2_fcRatings')||'{}'); } catch(e){}
  var attempts = loadAttempts();
  var misconceptions = _computeMisconceptions();
  var now = Date.now();
  var DAY = 86400000;

  // Compute per-chapter and per-topic accuracy
  var chapAgg = {}, topicAgg = {};
  function fold(qs, answers){
    if(!answers) return;
    answers.forEach(function(v,j){
      if(v===null||v===undefined||!qs[j]) return;
      var u=qs[j].unit||'—', tp=qs[j].topic||'—';
      chapAgg[u]=chapAgg[u]||{a:0,r:0};   chapAgg[u].a++;   if(v===qs[j].a) chapAgg[u].r++;
      topicAgg[tp]=topicAgg[tp]||{a:0,r:0}; topicAgg[tp].a++; if(v===qs[j].a) topicAgg[tp].r++;
    });
  }
  EXAMS.forEach(function(ex,i){ var s=loadState(i); if(s) fold(ex.questions, s.answers); });
  MCQS.forEach(function(mc,i){ var s=mcqState(i); if(s) fold(mc.questions, s.answers); });
  (XTRA||[]).forEach(function(g,i){ var s=xState(i); if(s) fold(g.questions, s.answers); });
  var weakChapters = {}, weakTopics = {};
  Object.keys(chapAgg).forEach(function(u){ var g=chapAgg[u]; if(g.a>=3 && (g.r/g.a)<0.7) weakChapters[u]=true; });
  Object.keys(topicAgg).forEach(function(t){ var g=topicAgg[t]; if(g.a>=3 && (g.r/g.a)<0.7) weakTopics[t]=true; });

  // Score wrong/flagged candidates
  var byText = {};
  function tag(item, kind){
    var text = String(item.q.q || '');
    if(!byText[text]) byText[text] = { q:item.q, ref:item.ref, score:0, why:{} };
    var s = byText[text];
    if(kind === 'wrong')   { s.score += 8; s.why.wrong = true; }
    if(kind === 'flagged') { s.score += 5; s.why.flagged = true; }
  }
  wrong.forEach(function(i){ tag(i,'wrong'); });
  flagged.forEach(function(i){ tag(i,'flagged'); });

  // Apply all the other signals to whatever we already have
  Object.keys(byText).forEach(function(t){
    var e = byText[t]; var q = e.q;
    if(e.why.wrong && e.why.flagged) { e.score += 4; e.why.doubleSignal = true; }
    if(weakChapters[q.unit||'']) { e.score += 3; e.why.weakChap = true; }
    if(weakTopics[q.topic||'']) { e.score += 2; e.why.weakTopic = true; }
    e.score += _textToughFeatures(q.q);
    // Flashcard confidence: rating 1 or 2 = "still confused"
    var rating = null;
    if(fcRatings && e.ref && fcRatings[e.ref] && typeof fcRatings[e.ref].rating === 'number') rating = fcRatings[e.ref].rating;
    if(rating !== null && rating <= 2) { e.score += 6; e.why.lowConf = true; }
    // Attempt history signals (only present if the student has attempted this question)
    var hist = attempts[_qh(q.q)];
    if(hist && hist.length){
      var wrongs = hist.filter(function(a){return !a.ok;}).length;
      var last = hist[hist.length-1];
      // Multiple wrong attempts across time = truly stuck
      if(wrongs >= 2){ e.score += 10; e.why.repeatWrong = true; }
      // Regression: got it right earlier, wrong now — confidence lost
      if(hist.length >= 2 && hist[hist.length-2].ok && !last.ok){ e.score += 8; e.why.regression = true; }
      // Recency: wrong within the last 3 days
      if(!last.ok && (now - (last.ts||0)) < 3*DAY){ e.score += 3; e.why.recentWrong = true; }
    }
    // Misconception pattern: student has a dominant wrong pick on this topic
    if(q.topic && misconceptions[q.topic]){
      e.score += 2;
      e.why.misconception = misconceptions[q.topic].bias; // stores the biased index
    }
  });

  // Fresh candidates: unanswered questions in weak chapters (real gaps)
  var freshCandidates = [];
  function seed(qs, refPrefix, sourceIdx, stateReader){
    var s = stateReader ? stateReader(sourceIdx) : null;
    qs.forEach(function(q, i){
      var u = q.unit || '';
      if(!weakChapters[u] && !weakTopics[q.topic||'']) return;
      if(s && s.answers && s.answers[i] !== null && s.answers[i] !== undefined) return;
      var text = String(q.q || '');
      if(byText[text]) return;
      var sc = 4 + _textToughFeatures(q.q);
      freshCandidates.push({
        q:q, ref: refPrefix + '_' + sourceIdx + '_' + i,
        score: sc, why:{fresh:true, weakChap:!!weakChapters[u], weakTopic:!!weakTopics[q.topic||'']}
      });
    });
  }
  EXAMS.forEach(function(ex,i){ seed(ex.questions, 'm', i, loadState); });
  MCQS.forEach(function(mc,i){ seed(mc.questions, 'mcq', i, mcqState); });
  (XTRA||[]).forEach(function(g,i){ seed(g.questions, 'xtra', i, xState); });
  for(var f=freshCandidates.length-1; f>0; f--){
    var fj=Math.floor(Math.random()*(f+1));
    var ft=freshCandidates[f]; freshCandidates[f]=freshCandidates[fj]; freshCandidates[fj]=ft;
  }
  freshCandidates.sort(function(a,b){ return b.score - a.score; });

  var scored = Object.keys(byText).map(function(t){ return byText[t]; });
  scored.sort(function(a,b){ return b.score - a.score; });

  // 70% wrong/flagged, 30% fresh weak-area — grow pool for AI reranking
  var poolSize = Math.max(limit, Math.min(50, scored.length + freshCandidates.length));
  var takeScored = Math.min(scored.length, Math.ceil(poolSize * 0.7));
  var raw = scored.slice(0, takeScored);
  var need = poolSize - raw.length;
  if(need > 0) raw = raw.concat(freshCandidates.slice(0, need));

  // ---- Diversify by chapter ----
  // Cap per-chapter to at most Math.ceil(limit / 5) so a single dominant weak chapter
  // doesn't swallow the whole quiz. Overflow goes into a "reserve" bucket that gets
  // dipped into only if we can't fill the pool from other chapters.
  var perChapCap = Math.max(3, Math.ceil(limit / 5));
  var chapCount = {}, primary = [], reserve = [];
  raw.forEach(function(c){
    var u = c.q.unit || '—';
    chapCount[u] = chapCount[u] || 0;
    if(chapCount[u] < perChapCap){ chapCount[u]++; primary.push(c); }
    else reserve.push(c);
  });
  var out = primary.concat(reserve);
  return out;
}

// AI rerank: takes ~40 candidates, sends the student's profile + candidate list to the tutor,
// asks for the top 25 ranked hardest-first for THIS specific student. Result is cached per Part
// so repeatedly opening "Toughest for me" doesn't re-fire the call.
var TOUGH_AI_CACHE_KEY = 'ea3quiz_v2_tough_ai_cache';
function _toughAiCacheGet(){
  try { return JSON.parse(localStorage.getItem(TOUGH_AI_CACHE_KEY)) || {}; } catch(e){ return {}; }
}
function _toughAiCacheSet(all){ try{ localStorage.setItem(TOUGH_AI_CACHE_KEY, JSON.stringify(all)); } catch(e){} }
function _stableQHash(text){
  var s = String(text || '');
  var h = 5381;
  for(var i=0;i<s.length;i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
async function aiRerankToughest(candidates, limit){
  limit = limit || 25;
  if(!candidates || candidates.length <= limit) return candidates; // nothing to rerank
  // Only run for the admin (same gate as the tutor) — costs tokens
  if(typeof isAdminUser !== 'function' || !isAdminUser()) return candidates;
  var authObj = (typeof auth === 'function') ? auth() : null;
  if(!authObj || !authObj.access_token) return candidates; // no auth = no AI

  // Cache check — 6-hour freshness per Part, and refresh if the candidate set has drifted
  var cacheKey = 'p' + (typeof PART!=='undefined'?PART:'?');
  var all = _toughAiCacheGet();
  var currentSig = candidates.map(function(c){ return _stableQHash(c.q.q); }).sort().join(',');
  var currentHash = _stableQHash(currentSig);
  var rec = all[cacheKey];
  var freshMs = 6 * 60 * 60 * 1000;
  if(rec && rec.t && (Date.now() - rec.t) < freshMs && rec.sig === currentHash && Array.isArray(rec.order)){
    // Reorder from cached ranking
    var byHash = {};
    candidates.forEach(function(c){ byHash[_stableQHash(c.q.q)] = c; });
    var ranked = rec.order.map(function(h){ return byHash[h]; }).filter(Boolean);
    // Any candidates the cache didn't rank get appended at the end
    var seen = {}; ranked.forEach(function(c){ seen[_stableQHash(c.q.q)] = true; });
    candidates.forEach(function(c){ if(!seen[_stableQHash(c.q.q)]) ranked.push(c); });
    return ranked.slice(0, limit);
  }

  // Build a compact rerank prompt
  var stats = (typeof _computeLearningStats === 'function') ? null : null;
  var perfLine = '';
  try {
    // Piggyback on the tutor's stat computation if available in scope, else recompute inline
    var chap = {}, topic = {}, tot = 0, ok = 0;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!/^ea3quiz_v2_(?:p[12]_)?(?:mock|mcq|extra)_/.test(k)) continue;
      var s=null; try{s=JSON.parse(localStorage.getItem(k));}catch(e){continue;}
      if(!s||!Array.isArray(s.answers)) continue;
      // Skip: we already have chapAgg-like info baked into candidate.why.*
    }
    perfLine = 'The student has flagged and gotten questions wrong across multiple chapters. Their weak areas are indicated by "weak" flags on candidates.';
  } catch(e){}

  var listStr = candidates.map(function(c, idx){
    var h = _stableQHash(c.q.q);
    var whyBits = [];
    if(c.why.repeatWrong)  whyBits.push('REPEAT-WRONG-2plus');
    if(c.why.regression)   whyBits.push('REGRESSION-right-then-wrong');
    if(c.why.recentWrong)  whyBits.push('RECENT-WRONG-3d');
    if(c.why.wrong)        whyBits.push('WRONG');
    if(c.why.flagged)      whyBits.push('FLAGGED');
    if(c.why.doubleSignal) whyBits.push('WRONG+FLAGGED');
    if(c.why.lowConf)      whyBits.push('low-confidence-fc');
    if(c.why.weakChap)     whyBits.push('weak-chapter');
    if(c.why.weakTopic)    whyBits.push('weak-topic');
    if(typeof c.why.misconception==='number') whyBits.push('bias-picks-' + 'ABCD'.charAt(c.why.misconception));
    if(c.why.fresh)        whyBits.push('unanswered');
    return '[' + h + '] score=' + Math.round(c.score) + ' signals=' + whyBits.join('|') +
           ' ch="' + (c.q.unit||'') + '" topic="' + (c.q.topic||'') + '" q="' + String(c.q.q||'').slice(0, 160).replace(/\n/g,' ') + '"';
  }).join('\n');

  // Also gather a compact misconception summary so the AI can plan a coherent progression
  var mc = _computeMisconceptions();
  var mcLines = Object.keys(mc).slice(0, 6).map(function(tp){
    return '- ' + tp + ': student keeps picking option ' + 'ABCD'.charAt(mc[tp].bias) + ' when wrong (' + mc[tp].count + ' data points)';
  }).join('\n');
  var mcBlock = mcLines ? 'KNOWN MISCONCEPTIONS (dominant wrong-choice pattern by topic):\n' + mcLines + '\n\n' : '';

  var prompt =
    'You are building a personalized "toughest questions for me" quiz for an EA-exam student. ' +
    'RANK the candidates below hardest-first FOR THIS SPECIFIC STUDENT, then return the top ' + limit + '.\n\n' +
    'Signal legend (higher-priority first):\n' +
    ' - REPEAT-WRONG-2plus: they have gotten this exact question wrong 2+ times → they are truly stuck\n' +
    ' - REGRESSION-right-then-wrong: they had it right on a prior attempt but got it wrong most recently → confidence lost\n' +
    ' - WRONG+FLAGGED: currently wrong AND marked for review → high-priority\n' +
    ' - RECENT-WRONG-3d: got it wrong within the last 3 days → still fresh in confusion\n' +
    ' - WRONG: current answer is wrong\n' +
    ' - FLAGGED: student marked for review\n' +
    ' - low-confidence-fc: they rated their flashcard confidence 1 or 2 out of 5\n' +
    ' - weak-chapter / weak-topic: their overall accuracy in this area is below 70%\n' +
    ' - bias-picks-X: on this topic the student consistently picks X when wrong (specific misconception)\n' +
    ' - unanswered: fresh question in a weak area\n\n' +
    mcBlock +
    'CANDIDATES (one per line, [hash] = stable id):\n' + listStr + '\n\n' +
    'Sequencing rules:\n' +
    ' 1. Prioritize REPEAT-WRONG > REGRESSION > WRONG+FLAGGED > RECENT-WRONG > WRONG > FLAGGED+lowConf > weak-area\n' +
    ' 2. Diversify across chapters/topics — no more than 2 in a row from the same chapter\n' +
    ' 3. If the student has a known misconception on a topic, include at least 2 questions covering that topic\n' +
    ' 4. Interleave: don\'t front-load all repeat-wrong questions (student will burn out); alternate difficulty\n\n' +
    'Return ONLY a JSON object of the form: {"ids":["<hash1>","<hash2>", ...]} — exactly ' + limit +
    ' hashes if available, ordered per the rules above. No prose, no code fences, just the JSON.';

  var response = '';
  try {
    // Same CORS reason as the tutor's send(): skip Authorization until the worker's
    // Access-Control-Allow-Headers is updated to include it.
    var res = await fetch('https://ea-ai.tr78601234.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });
    if(!res.ok || !res.body) return candidates;
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      response += decoder.decode(chunk.value, { stream: true });
    }
  } catch(e){ return candidates; }

  // Extract JSON — Gemini sometimes wraps in code fences
  var jsonMatch = response.match(/\{[\s\S]*\}/);
  if(!jsonMatch) return candidates;
  var parsed = null;
  try { parsed = JSON.parse(jsonMatch[0]); } catch(e){ return candidates; }
  var ids = parsed && Array.isArray(parsed.ids) ? parsed.ids : null;
  if(!ids || !ids.length) return candidates;

  // Persist ranking
  all[cacheKey] = { t: Date.now(), sig: currentHash, order: ids };
  _toughAiCacheSet(all);

  var byHash = {};
  candidates.forEach(function(c){ byHash[_stableQHash(c.q.q)] = c; });
  var ranked = ids.map(function(h){ return byHash[h]; }).filter(Boolean);
  var seen = {}; ranked.forEach(function(c){ seen[_stableQHash(c.q.q)] = true; });
  candidates.forEach(function(c){ if(!seen[_stableQHash(c.q.q)]) ranked.push(c); });
  return ranked.slice(0, limit);
}

function fcMasteryPct(){
  var wrong=collectWrong();
  if(!wrong.length) return 0;
  var r=loadFcRatings();
  var total=0;
  wrong.forEach(function(w){
    var entry=r[w.ref];
    total += entry ? entry.r : 0;
  });
  return Math.round((total / (wrong.length * 5)) * 100);
}
function pickWeightedDeck(pool, ratings, size){
  var weighted=pool.map(function(item){
    var entry=ratings[item.ref];
    var confidence=entry ? entry.r : 0;
    var weight = confidence===0 ? 5 : (7 - confidence);
    return {item:item, weight:weight};
  });
  var picked=[];
  var pickCount=Math.min(size, weighted.length);
  for(var i=0;i<pickCount;i++){
    var totalW=weighted.reduce(function(t,x){return t+x.weight;},0);
    var roll=Math.random()*totalW;
    var idx=0;
    for(var j=0;j<weighted.length;j++){
      roll -= weighted[j].weight;
      if(roll<=0){ idx=j; break; }
    }
    picked.push(weighted[idx].item);
    weighted.splice(idx,1);
  }
  return picked;
}

// Find the most relevant chapter-notes section for a given wrong question.
// Returns { front, back, source } or null if no match.
function findBookConcept(item){
  var q = item.q;
  if(!CHNOTES[PART] || !q.unit) return null;

  // Extract search terms: topic + significant words from the question and correct answer
  var stop = {the:1,a:1,an:1,is:1,are:1,was:1,were:1,of:1,to:1,in:1,on:1,at:1,for:1,with:1,by:1,and:1,or:1,but:1,not:1,which:1,following:1,what:1,when:1,where:1,who:1,how:1,does:1,do:1,did:1,has:1,have:1,had:1,be:1,been:1,being:1,this:1,that:1,these:1,those:1,it:1,as:1,if:1,then:1,than:1,from:1,into:1,about:1,taxpayer:1,taxpayers:1,any:1,all:1,each:1,every:1,some:1,except:1,following:1,statement:1,statements:1,true:1,false:1};

  function tokens(str){
    return String(str||'').toLowerCase()
      .replace(/[^a-z0-9§\s]/g,' ')
      .split(/\s+/)
      .filter(function(w){ return w.length>2 && !stop[w]; });
  }

  var qTokens = tokens(q.q + ' ' + (q.topic||'') + ' ' + q.opts[q.a]);
  if(!qTokens.length) return null;
  var tokenSet = {};
  qTokens.forEach(function(t){ tokenSet[t]=(tokenSet[t]||0)+1; });

  // Score every section in the current part's chapter notes
  var best = null;
  var C = CHNOTES[PART];
  Object.keys(C).forEach(function(unitNum){
    var u = C[unitNum];
    if(!u || !u.s) return;
    // Boost score if this section is in the same unit as the question
    var unitBoost = (String(unitNum) === String(q.unit) || (u.t && q.unit && u.t.toLowerCase().indexOf(String(q.unit).toLowerCase())>=0)) ? 3 : 0;
    u.s.forEach(function(sec, si){
      if(!sec.b || !sec.b.length) return;
      var body = sec.t + ' ' + sec.b.join(' ');
      var bodyLower = body.toLowerCase();
      var score = unitBoost;
      Object.keys(tokenSet).forEach(function(t){
        // count occurrences (approximate)
        var re = new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
        var matches = bodyLower.match(re);
        if(matches) score += matches.length;
      });
      if(!best || score > best.score){
        best = { score:score, unit:unitNum, unitTitle:u.t, sec:sec, si:si };
      }
    });
  });

  if(!best || best.score < 3) return null; // require a minimum relevance

  // Format the answer using the actual book section
  var body = best.sec.b.slice(0, 6).join('\n\n'); // up to 6 paragraphs to keep it focused
  var back = body;
  if(best.sec.b.length > 6){
    back += '\n\n(Additional detail in SU ' + best.unit + ' — see full Chapter Notes)';
  }

  // Front: Use the topic if available, otherwise a concept-based prompt
  var front = q.topic
    ? 'Explain: ' + q.topic
    : (q.q.length < 120 ? q.q : q.q.slice(0,120)+'…');

  return {
    front: front,
    back: back,
    source: 'SU ' + best.unit + (best.sec.t ? ' — ' + best.sec.t : '')
  };
}

// Ask the AI Worker as a fallback ONLY when no book match found.
// We include the verified question + correct answer + why so it can't invent facts.
async function generateConceptCard(item){
  // First try to find it in the book
  var bookConcept = findBookConcept(item);
  if(bookConcept) return bookConcept;

  // Fallback: use the verified quiz data as-is (no AI hallucination)
  var q = item.q;
  var correctLetter = String.fromCharCode(65+q.a);
  var back = 'Correct answer (' + correctLetter + '): ' + q.opts[q.a];
  if(q.why) back += '\n\n' + q.why;
  return {
    front: q.topic ? 'Recall: ' + q.topic : q.q,
    back: back,
    source: 'From your question bank'
  };
}

async function ensureConceptForCurrent(){

  renderFlashcard();
}

function fcPrevCard(){

  FC_CURRENT_CONCEPT=null;

  renderFlashcard();
}

var _fcKeyHandler=null;
function bindFcKeys(){
  if(_fcKeyHandler) return;
  _fcKeyHandler=function(e){
    // Ignore if typing in an input
    var tag=(e.target && e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    // Only active on flashcard view
    if(document.body.getAttribute('data-view')!=='flashcards') return;
    if(e.key===' '||e.key==='Spacebar'){
      e.preventDefault();
      if(!FC_CURRENT_CONCEPT) return;
      if(!FC_REVEALED){ FC_REVEALED=true; renderFlashcard(); }
      else { rateCurrentCard(3); } // Space after reveal = neutral "kinda" and advance
    } else if(/^[1-5]$/.test(e.key) && FC_REVEALED){
      e.preventDefault();
      rateCurrentCard(+e.key);
    } else if(e.key==='Escape'){
      e.preventDefault();
      if(confirm('Exit flashcards? Your ratings are saved.')){ unbindFcKeys(); showMenu(); }
    } else if(e.key==='ArrowLeft'){
      e.preventDefault();
      fcPrevCard();
    } else if(e.key==='r'||e.key==='R'){
      e.preventDefault();
      fcRegenerateCurrent();
    }
  };
  document.addEventListener('keydown', _fcKeyHandler);
}
function unbindFcKeys(){
  if(_fcKeyHandler){ document.removeEventListener('keydown', _fcKeyHandler); _fcKeyHandler=null; }
}

// Format an explanation string so the correct-answer reasoning and the
// 'Why the others are wrong:' bullets render as separate paragraphs and lines.
function fmtExpl(s){
  if(!s) return '';
  var parts=s.split(/\s*Why the others are wrong:\s*/i);
  var main=(parts[0]||'').trim();
  // paragraph-break the main reasoning on double newlines OR sentence-boundary heuristic
  var mainHtml=main.split(/\n{2,}/).map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('');
  var out=mainHtml;
  if(parts.length>1 && parts[1].trim()){
    out+='<div class="wow-hd"><b>Why the others are wrong:</b></div>';
    // Split on bullet markers (accept • or -) preceding option letters A-D)
    var body=parts[1];
    var bullets=body.split(/(?=[•\-]\s*[A-D]\)\s*)/).map(function(b){return b.trim();}).filter(Boolean);
    bullets.forEach(function(b){
      var m=b.match(/^[•\-]\s*([A-D])\)\s*([\s\S]*)$/);
      if(m){
        out+='<div class="wow-item"><b>'+m[1]+')</b> '+esc(m[2].trim())+'</div>';
      }else{
        out+='<div class="wow-item">'+esc(b)+'</div>';
      }
    });
  }
  return out;
}

  if(st&&st.pos!==pos){st.pos=pos;saveState();}
  setFloatBack(goBack,'← Back');
  document.getElementById('counter').textContent=examName()+' — Question '+(pos+1)+' of '+QUESTIONS.length;
  headerScore();
  const c=counts();
  document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const letters=['A','B','C','D'];
  card.innerHTML='<div class="badges"><span class="badge">'+Q.topic+'</span><span class="badge unit">'+Q.unit+'</span>'+
    (exam<0&&REVIEW_REFS[qIdx]?'<span class="badge unit">'+REVIEW_REFS[qIdx].replace(/m(\d+)_(\d+)/,function(_,e,i){return 'Mock '+(+e+1)+' · Q'+(+i+1);})+'</span>':'')+
    '<button class="flagbtn'+(st.flags[qIdx]?' on':'')+'" id="flagBtn">⚑ '+(st.flags[qIdx]?'Flagged':'Flag')+'</button>'+
    (function(){
      // AI is gated: only the account owner (see ADMINS) gets the button.
      // Show the inline Ask AI button for admin OR demo users with quota left
      var _isAdmin = (typeof isAdminUser === 'function' && isAdminUser());
      var _isDemo  = (typeof isDemoActive === 'function' && isDemoActive() && typeof demoAiRemaining === 'function' && demoAiRemaining() > 0);
      if (!_isAdmin && !_isDemo) return '';
      var isWrong = (st.answers[qIdx]!==null && st.answers[qIdx]!==Q.a && feedbackOn());
      var label = isWrong ? '💡 Why did I get this wrong?' : '✨ Ask AI';
      var cls = isWrong ? 'flagbtn askai-hot' : 'flagbtn';
      return '<button class="'+cls+'" id="askAiBtn" data-hot="'+(isWrong?'1':'0')+'" title="Ask AI to explain this question (shortcut: ? or i)">'+label+'</button>';
    })()+
    (st.answers[qIdx]!==null?'<button class="flagbtn" id="resetQBtn" title="Clear your answer for this question">↺ Reset</button>':'')+
    (canReveal()&&st.answers[qIdx]===null&&!st.revealAll?'<button class="flagbtn'+(isRevealed(qIdx)?' on':'')+'" id="seeAnsBtn">👁 '+(isRevealed(qIdx)?'Hide answer':'See answer')+'</button>':'')+'</div>'+
    '<div class="qtext">'+Q.q+'</div>'+
    '<div id="opts">'+perm.map(function(orig,j){return '<button class="opt" data-i="'+j+'"><span class="letter">'+letters[j]+'.</span>'+Q.opts[orig]+'</button>';}).join('')+'</div>'+
    refresherHTML(Q)+
    '<div id="verdict"></div><div class="exp" id="exp"></div>'+
    '<div class="nav2"><button class="navbtn" id="prev"'+(pos===0?' disabled':'')+'>← Previous</button><button class="navbtn primary" id="next">'+(pos===QUESTIONS.length-1?(st.mode==='exam'&&!st.examDone?'Finish':'Results'):'Next')+' →</button></div>';
  card.querySelectorAll('#opts .opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.i);};});
  wireRefresher();
  document.getElementById('flagBtn').onclick=function(){
    st.flags[qIdx]=!st.flags[qIdx];saveState();renderSide();render();
  };
  var aab=document.getElementById('askAiBtn');
  if(aab)aab.onclick=function(){
    var btn=document.getElementById('ai-tutor-btn');
    var panel=document.getElementById('ai-tutor-panel');
    var input=document.getElementById('ai-tutor-input');
    var sendBtn=document.getElementById('ai-tutor-send');
    if(!panel||!input||!sendBtn)return;
    // Route through the floating tutor button's open handler so the quiz
    // reflows left (body.ai-open), chat history restores, etc. If the panel
    // is already open, just prefill and send.
    var wasOpen = (panel.style.display === 'flex' && !panel.classList.contains('minimized'));
    if(!wasOpen && btn && btn.style.display !== 'none'){ btn.click(); }
    else if(panel.classList.contains('minimized')){
      panel.classList.remove('minimized');
      if(window.innerWidth >= 1024) document.body.classList.add('ai-open');
    }
    // Prefill and send — targeted prompt if the student got this question wrong
    var isHot = aab.getAttribute('data-hot') === '1';
    input.value = isHot
      ? 'I chose the wrong answer to this question. Explain why my choice is wrong and why the correct answer is right. Focus on the specific rule I got confused about, and give me a one-line way to remember it next time.'
      : 'Explain this question in detail. Break down why the correct answer is right and why each wrong answer is wrong.';
    setTimeout(function(){sendBtn.click();},80);
  };
  var rqb=document.getElementById('resetQBtn');
  if(rqb)rqb.onclick=function(){
    if(!confirm('Reset your answer to this question? You can answer it again.'))return;
    st.answers[qIdx]=null;
    setRevealed(qIdx,false);
    saveState();
    renderSide();
    render();
    headerScore();
  };
  document.getElementById('prev').onclick=function(){if(pos>0){pos--;renderSide();render();scrollTop();}};
  document.getElementById('next').onclick=function(){
    if(pos<QUESTIONS.length-1){pos++;renderSide();render();scrollTop();}
    else st.mode==='exam'&&!st.examDone?confirmSubmit():showEnd();
  };
  var sab=document.getElementById('seeAnsBtn');
  if(sab)sab.onclick=function(){setRevealed(qIdx,!isRevealed(qIdx));renderSide();render();};
  if(st.answers[qIdx]!==null){feedbackOn()?showFeedback():markSelection();}
  else if(isRevealed(qIdx))showRevealed();
}

// ---------- quick refresher (book-sourced) ----------
function unitNumOf(u){var m=/^SU\s*(\d+)/.exec(u||'');return m?+m[1]:null;}
function refreshFor(Q){
  var R=REFRESH[PART]; if(!R)return null;
  var un=unitNumOf(Q.unit);
  var keys=R.tmap[Q.topic+'||'+un]||R.tmap[Q.topic+'||null']||null;
  if(!keys||!keys.length){
    if(un&&R.units[un])return {unit:un,secs:[],ub:R.units[un]};
    return null;
  }
  return {unit:un,secs:keys.map(function(k){return R.secs[k];}).filter(Boolean),ub:(un&&R.units[un])?R.units[un]:null};
}
function qrefKey(){
  if(exam>=0)return 'mock:'+exam+':'+st.order[pos];
  if(exam===-4)return 'mcq:'+MCH+':'+st.order[pos];
  return null;               // chapter/review sessions resolve via source ref below
}
function qrefFor(Q){
  var R=QREF[PART]; if(!R)return null;
  var k=qrefKey();
  // chapter-from-mocks and Smart Review carry a source ref like m0_12 -> mock:0:12
  if(!k&&exam<0&&REVIEW_REFS&&REVIEW_REFS[st.order[pos]]){
    var m=/^m(\d+)_(\d+)$/.exec(REVIEW_REFS[st.order[pos]]);
    if(m)k='mock:'+m[1]+':'+m[2];
  }
  if(!k)return null;
  var ids=R.q[k]; if(!ids||!ids.length)return null;
  return ids.map(function(pr){var p=R.p[pr[0]];return p?{u:p.u,sec:p.s,t:p.t,score:pr[1]}:null;}).filter(Boolean);
}
function refresherHTML(Q){
  var hits=qrefFor(Q);
  if(!hits||!hits.length)return '';
  var strong=hits[0].score>=0.20;
  var body=hits.map(function(h){
    return '<div class="rsec"><b>SU '+h.u+' · '+h.sec+'</b><p>'+h.t+'</p></div>';
  }).join('');
  var lbl=hits[0].sec;
  return '<div class="refbox"><button class="refhead" id="refToggle">📌 '+(strong?'What the book says':'Related background')+
    ' <span class="reflbl">'+lbl.slice(0,60)+'</span><span class="chev" id="refChev">▸</span></button>'+
    '<div class="refbody" id="refBody" style="display:none">'+body+
    '<p class="refsrc">Passages from your '+PARTS[PART].name+' study guide, matched to this question.'+
    ((CHNOTES[PART]&&hits[0].u&&CHNOTES[PART][hits[0].u])?' <a href="#" id="refFull">Open full chapter notes →</a>':'')+
    '</p></div></div>';
}
function wireRefresher(){
  var b=document.getElementById('refToggle'); if(!b)return;
  b.onclick=function(){
    var body=document.getElementById('refBody'),ch=document.getElementById('refChev');
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    ch.textContent=open?'▸':'▾';
    var rf=document.getElementById('refFull');
    if(rf&&!rf._w){rf._w=1;rf.onclick=function(ev){
      ev.preventDefault();
      var hits=qrefFor(QUESTIONS[st.order[pos]]);
      if(hits&&hits[0])showNotes(hits[0].u,function(){enterQuiz();});
    };}
  };
}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function markSelection(){
  const qIdx=st.order[pos],perm=getPerm(qIdx);
  const selDisp=perm.indexOf(st.answers[qIdx]);
  card.querySelectorAll('#opts .opt').forEach(function(b,j){b.classList.toggle('sel',j===selDisp);});
}
function pick(dispJ){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const orig=perm[dispJ];
  if(st.mode==='exam'&&!st.examDone){
    st.answers[qIdx]=orig;recordAnswerToday();recordAttempt(Q,orig);saveState();markSelection();renderSide();headerScore();
    const c=counts();document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
    return;
  }
  if(st.answers[qIdx]!==null)return;
  st.answers[qIdx]=orig;
  updateSrs(refOf(qIdx),orig===Q.a);
  recordAnswerToday();
  recordAttempt(Q,orig);
  saveState();renderSide();showFeedback();headerScore();
  const c=counts();document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
}

// ---- Per-question attempt history (used by Toughest for Me) ----
// Stored as { qHash: [{ts, c: chosenIdx, ok: 0|1}, …] } — keeps up to the last 5 attempts.
// Different from st.answers which only remembers the LAST answer.
var ATTEMPTS_KEY='ea3quiz_v2_attempts';
function _qh(text){var s=String(text||''),h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36);}
function loadAttempts(){try{return JSON.parse(localStorage.getItem(ATTEMPTS_KEY))||{};}catch(e){return {};}}
function saveAttempts(a){try{localStorage.setItem(ATTEMPTS_KEY,JSON.stringify(a));}catch(e){}}
function recordAttempt(Q,chose){
  try{
    if(!Q||typeof chose!=='number')return;
    var a=loadAttempts();
    var k=_qh(Q.q);
    if(!a[k])a[k]=[];
    a[k].push({ts:Date.now(),c:chose,ok:(chose===Q.a)?1:0});
    if(a[k].length>5)a[k]=a[k].slice(-5);
    // Global cap: retain the 500 most-recently-touched questions to bound localStorage
    var keys=Object.keys(a);
    if(keys.length>500){
      keys.sort(function(k1,k2){
        var t1=a[k1][a[k1].length-1].ts||0,t2=a[k2][a[k2].length-1].ts||0;
        return t2-t1;
      });
      var kept={};keys.slice(0,500).forEach(function(k){kept[k]=a[k];});
      a=kept;
    }
    saveAttempts(a);
  }catch(e){}
}
function showFeedback(){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const sel=st.answers[qIdx],isRight=sel===Q.a,letters=['A','B','C','D'];
  const correctDisp=perm.indexOf(Q.a),selDisp=perm.indexOf(sel);
  card.querySelectorAll('#opts .opt').forEach(function(b,j){
    b.disabled=true;
    if(j===correctDisp)b.classList.add('correct');
    else if(j===selDisp)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  document.getElementById('verdict').innerHTML='<div class="verdict '+(isRight?'ok':'no')+'">'+(isRight?'✓ Correct!':'✗ Incorrect — the correct answer is '+letters[correctDisp]+'.')+'</div>';
  let html;
  if(Q.expl!==undefined){
    html='<h4>Explanation (correct answer: '+letters[correctDisp]+')</h4><div class="why">'+fmtExpl(Q.expl)+'</div>';
  }else{
    html='<h4>Why '+letters[correctDisp]+' is correct</h4><div class="why">'+Q.why+'</div><h4>Why the other choices are wrong</h4>';
    perm.forEach(function(orig,j){const w=Q.wrongs[orig];if(w)html+='<div class="wrongitem"><b>'+letters[j]+'.</b> '+w+'</div>';});
  }
  const exp=document.getElementById('exp');
  exp.innerHTML=html;exp.style.display='block';
}
// Show the correct answer and explanation for a question the user has not answered.
function showRevealed(){
  const qIdx=st.order[pos],Q=QUESTIONS[qIdx],perm=getPerm(qIdx);
  const letters=['A','B','C','D'],correctDisp=perm.indexOf(Q.a);
  card.querySelectorAll('#opts .opt').forEach(function(b,j){
    b.disabled=true;
    if(j===correctDisp)b.classList.add('correct'); else b.classList.add('dim');
  });
  document.getElementById('verdict').innerHTML=
    '<div class="revealnote">👁 Answer shown — <b>'+letters[correctDisp]+'</b> is correct. '+
    'This question stays unanswered and is not scored.'+
    (st.revealAll?'':' <a href="#" id="unreveal">Hide and attempt it</a>')+'</div>';
  let html;
  if(Q.expl!==undefined){
    html='<h4>Explanation (correct answer: '+letters[correctDisp]+')</h4><div class="why">'+fmtExpl(Q.expl)+'</div>';
  }else{
    html='<h4>Why '+letters[correctDisp]+' is correct</h4><div class="why">'+Q.why+'</div><h4>Why the other choices are wrong</h4>';
    perm.forEach(function(orig,j){const w=Q.wrongs[orig];if(w)html+='<div class="wrongitem"><b>'+letters[j]+'.</b> '+w+'</div>';});
  }
  const exp=document.getElementById('exp');
  exp.innerHTML=html;exp.style.display='block';
  const un=document.getElementById('unreveal');
  if(un)un.onclick=function(e){e.preventDefault();setRevealed(qIdx,false);renderSide();render();};
}

function confirmSubmit(){
  side.classList.remove('open');
  const c=counts();
  const un=QUESTIONS.length-c.ans;
  card.innerHTML='<div class="end"><h2>Submit '+examName()+'?</h2>'+
    '<p style="margin:12px 0">'+(un?('You still have <b>'+un+' unanswered question'+(un>1?'s':'')+'</b>. Unanswered questions count as wrong.'):'All questions answered.')+'</p>'+
    '<button class="restart" id="doSubmit">Submit Exam</button>'+
    '<button class="restart" id="goBack" style="background:#64748b;margin-left:8px">Keep Working</button></div>';
  document.getElementById('doSubmit').onclick=function(){submitExam(false);};
  document.getElementById('goBack').onclick=function(){renderSide();render();};
}
function submitExam(auto){
  st.examDone=true;
  st.answers.forEach(function(v,i){if(v!==null)updateSrs(refOf(i),v===QUESTIONS[i].a);});
  saveState();stopTimer();
  if(auto)alert('Time is up! Your exam has been submitted automatically.');
  renderSide();showEnd();
}
function showEnd(){
  stopTimer();side.classList.remove('open');
  const c=counts();
  document.getElementById('prog').style.width=(c.ans/QUESTIONS.length*100)+'%';
  document.getElementById('counter').textContent=examName()+' — Results';
  const denom=st.mode==='exam'&&st.examDone?QUESTIONS.length:(c.ans||1);
  const pct=Math.round(c.right/denom*100);
  const units={};
  QUESTIONS.forEach(function(q,i){
    units[q.unit]=units[q.unit]||{total:0,right:0,ans:0};
    units[q.unit].total++;
    if(st.answers[i]!==null){units[q.unit].ans++;if(st.answers[i]===q.a)units[q.unit].right++;}
  });
  const unitRows=Object.entries(units).map(function(en){var u=en[0],s=en[1];return '<tr><td>'+u+'</td><td>'+s.right+'/'+s.ans+' (of '+s.total+')</td><td>'+(s.ans?Math.round(s.right/s.ans*100):0)+'%</td></tr>';}).join('');
  const missed=[];
  st.order.forEach(function(qIdx,p){if(st.answers[qIdx]!==null&&st.answers[qIdx]!==QUESTIONS[qIdx].a)missed.push({p:p,q:QUESTIONS[qIdx]});});
  const flagged=[];
  st.order.forEach(function(qIdx,p){if(st.flags[qIdx])flagged.push({p:p,q:QUESTIONS[qIdx]});});
  let extra='';
  if(st.mode==='exam'&&st.examDone&&st.examStart)extra='<p style="color:var(--muted);font-size:13.5px">Time used: '+fmtMs(Math.min(Date.now()-st.examStart,EXAM_MS))+' of 3:30:00</p>';
  const missedList=missed.length?'<h4 style="margin-top:18px">Questions you missed ('+missed.length+')</h4><ul class="missed">'+missed.map(function(m){return '<li><a href="#" data-g="'+m.p+'"><b>Q'+(m.p+1)+'</b></a> — '+m.q.topic+'</li>';}).join('')+'</ul>':(c.ans===QUESTIONS.length?'<p style="margin-top:14px">Perfect — nothing missed! 🎉</p>':'');
  const flagList=flagged.length?'<h4 style="margin-top:14px">Flagged for review (⚑ '+flagged.length+')</h4><ul class="missed">'+flagged.map(function(m){return '<li><a href="#" data-g="'+m.p+'"><b>Q'+(m.p+1)+'</b></a> — '+m.q.topic+'</li>';}).join('')+'</ul>':'';
  card.innerHTML='<div class="end"><h2>'+examName()+' — Results'+(c.ans<QUESTIONS.length&&!(st.mode==='exam'&&st.examDone)?' (in progress)':'')+'</h2>'+
    '<div class="big" style="color:'+(pct>=75?'var(--green)':'var(--red)')+'">'+pct+'%</div>'+
    '<p>You answered <b>'+c.right+' of '+c.ans+'</b> correctly'+(QUESTIONS.length-c.ans>0?' ('+(QUESTIONS.length-c.ans)+' unanswered)':'')+'. The average student score is 75%.</p>'+extra+
    '<table><tr><th>Study Unit</th><th>Correct</th><th>%</th></tr>'+unitRows+'</table>'+missedList+flagList+
    '<button class="restart" id="back">Back to Questions</button>'+
    '<button class="restart" id="menu" style="background:#64748b;margin-left:8px">Exam Menu</button></div>';
  card.querySelectorAll('[data-g]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();pos=+a.dataset.g;renderSide();render();};});
  document.getElementById('back').onclick=function(){startTimerIfNeeded();renderSide();render();};
  document.getElementById('menu').onclick=showMenu;
}
